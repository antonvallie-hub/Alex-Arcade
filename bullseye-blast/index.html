<script>
'use strict';
/* ===== Bullseye Blast! — core data, save, audio, speech ===== */
const WEAPONS=[
 {k:'cork',  name:'Cork Popper',        req:0, spd:1500,cd:0.30,assist:1.00,splash:0,  dmg:1,col:'#ff4d4d',col2:'#fff1c9'},
 {k:'foam',  name:'Foam Dart Blaster',  req:4, spd:1600,cd:0.27,assist:1.03,splash:0,  dmg:1,col:'#ff8a1f',col2:'#3d8bff'},
 {k:'water', name:'Water Blaster',      req:9, spd:1350,cd:0.24,assist:1.05,splash:0.45,dmg:1,col:'#3fd0ff',col2:'#e6fbff'},
 {k:'paint', name:'Paint Ball Blaster', req:15,spd:1600,cd:0.23,assist:1.06,splash:0.4,dmg:1,col:'#b04dff',col2:'#b6ff3d'},
 {k:'bubble',name:'Bubble Cannon',      req:22,spd:950, cd:0.26,assist:1.13,splash:0.55,dmg:1,col:'#ff9ad5',col2:'#9fe8ff'},
 {k:'laser', name:'Laser Blaster',      req:30,spd:0,   cd:0.19,assist:1.08,splash:0.3,dmg:1,col:'#22e3ff',col2:'#eaffff'},
 {k:'plasma',name:'Star Plasma Blaster',req:40,spd:2100,cd:0.18,assist:1.10,splash:0.6,dmg:1,col:'#ff3df2',col2:'#ffe25a'},
 {k:'mega',  name:'Rainbow Mega Blaster',req:52,spd:2300,cd:0.16,assist:1.14,splash:0.75,dmg:2,col:'#ffffff',col2:'#ffd23f'}];
const RANGES=[
 {k:'yard',    name:'Sunny Training Yard',req:0, mote:'leaf',  counter:['#c98a4a','#8a5427'],rail:'#7a4a22',boss:'robot',bossHue:0,  bossName:'Robo Target'},
 {k:'carnival',name:'Carnival Midway',   req:7, mote:'spark', counter:['#d8463d','#8e2a24'],rail:'#c9a04a',boss:'totem',bossHue:0,  bossName:'Totem Tower'},
 {k:'canyon',  name:'Desert Canyon',     req:17,mote:'dust',  counter:['#d79a5c','#9a5f2e'],rail:'#6b4426',boss:'ufo',  bossHue:0,  bossName:'Saucer Target'},
 {k:'snow',    name:'Snowy Mountain',    req:29,mote:'snow',  counter:['#8fb7d9','#4f7ba3'],rail:'#5a6f86',boss:'robot',bossHue:180,bossName:'Frosty Bot'},
 {k:'space',   name:'Space Station',     req:42,mote:'star',  counter:['#dfe9f2','#7f95ab'],rail:'#3fd9e6',boss:'ufo',  bossHue:150,bossName:'Mega Saucer'}];
const TSETS=[
 {k:'classic',name:'Classic Targets',req:0, hue:0},
 {k:'ocean',  name:'Ocean Targets',  req:12,hue:190},
 {k:'candy',  name:'Candy Targets',  req:26,hue:290},
 {k:'jungle', name:'Jungle Targets', req:46,hue:100}];
const STAGES_PER=4, NSTAGE=RANGES.length*STAGES_PER;
// target kinds
const KINDS={
 bull:   {img:'t_bull',   name:'Bullseye',  size:1.0, eye:1, fx:'wood', motion:'pop'},
 popup:  {img:'t_popup',  name:'Pop up target',size:1.0,eye:1,fx:'wood',motion:'rise',cy:-0.13,cr:0.62},
 plate:  {img:'t_plate',  name:'Spinning plate',size:0.9,eye:0.5,fx:'ceramic',motion:'spin'},
 balloon:{img:'t_balloon',name:'Balloon',   size:0.9, eye:0, fx:'pop',  motion:'float',cy:-0.12,cr:0.62},
 can:    {img:'t_can',    name:'Tin can',   size:0.78,eye:0, fx:'clang',motion:'arc'},
 bottle: {img:'t_bottle', name:'Juice bottle',size:0.85,eye:0,fx:'glass',motion:'shelf',cr:0.5,cy:0.1},
 clay:   {img:'t_clay',   name:'Flying disc',size:0.8, eye:0, fx:'ceramic',motion:'fling'},
 duck:   {img:'t_duck',   name:'Carnival duck',size:0.95,eye:1,fx:'wood',motion:'slide',cx:-0.04,cy:0.12,cr:0.5},
 drone:  {img:'t_drone',  name:'Robot drone',size:0.9, eye:1, fx:'zap', motion:'hover',cy:0.1,cr:0.75},
 spring: {img:'t_spring', name:'Bouncy target',size:0.95,eye:1,fx:'wood',motion:'bounce',cy:-0.2,cr:0.55},
 star:   {img:'t_star',   name:'Golden star',size:0.85,eye:1,fx:'gold', motion:'dash'},
 glass:  {img:null,       name:'Glass pane',size:0.95, eye:0, fx:'glass',motion:'pop'},
 decoy:  {img:'t_decoy',  name:'Friendly sign',size:0.95,eye:0,fx:'decoy',motion:'pop',cy:-0.18,cr:0.62}};
// per-range kind pools [stage1..4 additions]
const POOLS=[
 [['bull'],['bull','popup'],['bull','popup','balloon'],['bull','popup','balloon']],
 [['duck','balloon','popup'],['duck','balloon','bottle'],['duck','bottle','popup','balloon','decoy'],['duck','balloon','decoy']],
 [['can','bottle','popup','decoy'],['can','clay','bottle','decoy'],['clay','spring','can','bottle','decoy'],['spring','can','clay','decoy']],
 [['plate','glass','clay','decoy'],['glass','drone','plate','decoy'],['drone','clay','glass','spring','decoy'],['drone','glass','plate','decoy']],
 [['drone','glass','bull','decoy'],['drone','balloon','glass','spring','decoy'],['drone','clay','duck','glass','plate','decoy'],['drone','glass','spring','decoy']]];
// unlock bit layout in S.u: weapons 0-7, ranges 8-12, sets 13-16
const UNLOCKS=[];
WEAPONS.forEach((c,i)=>UNLOCKS.push({type:'weapon',idx:i,bit:i,req:c.req,item:c}));
RANGES.forEach((c,i)=>UNLOCKS.push({type:'range',idx:i,bit:8+i,req:c.req,item:c}));
TSETS.forEach((c,i)=>UNLOCKS.push({type:'tset',idx:i,bit:13+i,req:c.req,item:c}));

/* ---------- save in URL hash ---------- */
const S={s:0,b:'',w:0,t:0,a:0,m:1,x:1,u:0,i:0,p:0,v:0};
const BITKEYS={u:1,i:1};
function loadSave(){
  try{
    const h=String(location.hash||'').replace(/^#/,'');
    h.split('&').forEach(p=>{const kv=p.split('=');const k=kv[0];if(!(k in S))return;
      if(k==='b'){S.b=String(kv[1]||'').replace(/[^0-3]/g,'').slice(0,NSTAGE);return;}
      const n=parseInt(kv[1],BITKEYS[k]?36:10);if(isFinite(n)&&n>=0)S[k]=n;});
  }catch(e){}
  while(S.b.length<NSTAGE)S.b+='0';
  S.w=Math.min(S.w,WEAPONS.length-1);S.t=Math.min(S.t,TSETS.length-1);
  if(!isUnlocked(WEAPONS[S.w]))S.w=0;if(!isUnlocked(TSETS[S.t]))S.t=0;
  UNLOCKS.forEach(u=>{if(u.req===0)S.u|=(1<<u.bit);});
}
let saveTimer=0;
function hashString(){return Object.keys(S).map(k=>k+'='+(k==='b'?S.b.replace(/0+$/,''):BITKEYS[k]?S[k].toString(36):S[k])).join('&');}
function saveNow(){const h='#'+hashString();try{history.replaceState(null,'',h);}catch(e){try{location.hash=h;}catch(e2){}}}
function save(){clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,250);}
function isUnlocked(item){return !!S.a||S.s>=item.req;}
function best(i){return +S.b[i]||0;}
function setBest(i,v){if(v>best(i)){S.b=S.b.slice(0,i)+v+S.b.slice(i+1);}}
function stageOpen(i){if(S.a)return true;if(i===0)return true;const r=Math.floor(i/STAGES_PER);
  if(i%STAGES_PER===0)return best(i-1)>0&&isUnlocked(RANGES[r]);return best(i-1)>0;}
function nextStage(){for(let i=0;i<NSTAGE;i++)if(!best(i)&&stageOpen(i))return i;
  // all played or blocked: lowest-star open stage
  let bi=0,bv=9;for(let i=0;i<NSTAGE;i++)if(stageOpen(i)&&best(i)<bv){bv=best(i);bi=i;}return bi;}

/* ---------- audio ---------- */
let AC=null,master=null,musicG=null,sfxG=null,noiseBuf=null;
function initAudio(){
  if(AC){if(AC.state==='suspended'){try{AC.resume();}catch(e){}}return;}
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  try{AC=new C();}catch(e){AC=null;return;}
  const comp=AC.createDynamicsCompressor();comp.threshold.value=-14;comp.knee.value=10;comp.ratio.value=4;comp.attack.value=0.003;comp.release.value=0.18;
  comp.connect(AC.destination);
  master=AC.createGain();master.gain.value=0.9;master.connect(comp);
  musicG=AC.createGain();musicG.gain.value=S.m?0.3:0;musicG.connect(master);
  sfxG=AC.createGain();sfxG.gain.value=S.x?0.85:0;sfxG.connect(master);
  noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
  const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  Music.reset();
}
function setMusic(on){S.m=on?1:0;if(musicG)musicG.gain.setTargetAtTime(on?0.3:0,AC.currentTime,0.05);save();}
function setSfx(on){S.x=on?1:0;if(sfxG)sfxG.gain.setTargetAtTime(on?0.85:0,AC.currentTime,0.05);if(!on)Speech.stop();save();}
function now(){return AC?AC.currentTime:0;}
function env(g,t,a,peak,dur){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);}
function tone(type,f0,f1,t,dur,vol,dest,att){
  if(!AC)return null;const o=AC.createOscillator(),g=AC.createGain();o.type=type;
  o.frequency.setValueAtTime(f0,t);if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  env(g,t,att||0.005,vol,dur);o.connect(g);g.connect(dest||sfxG);o.start(t);o.stop(t+dur+0.05);return o;}
function noise(t,dur,vol,ftype,f0,f1,q,dest,att){
  if(!AC)return;const s=AC.createBufferSource();s.buffer=noiseBuf;s.playbackRate.value=0.7+Math.random()*0.6;
  const f=AC.createBiquadFilter();f.type=ftype||'bandpass';f.frequency.setValueAtTime(f0,t);
  if(f1&&f1!==f0)f.frequency.exponentialRampToValueAtTime(f1,t+dur);f.Q.value=q||1;
  const g=AC.createGain();env(g,t,att||0.004,vol,dur);s.connect(f);f.connect(g);g.connect(dest||sfxG);
  s.start(t,Math.random()*0.5);s.stop(t+dur+0.05);}
function metal(t,f,dur,vol){[1,1.47,2.09,2.56,3.12].forEach((r,i)=>tone('sine',f*r,f*r*0.995,t,dur*(1-i*0.13),vol/(1+i*0.7)));}
const PENTA=[0,2,4,7,9];
function pentaHz(i,base){const o=Math.floor(i/5),d=((i%5)+5)%5;return (base||587.33)*Math.pow(2,(PENTA[d]+12*o)/12);}
function mtof(m){return 440*Math.pow(2,(m-69)/12);}
const Sfx={
  ok(){return AC&&S.x;},
  fire(k){if(!this.ok())return;const t=now();
    switch(k){
      case 'cork':tone('sine',900,260,t,0.07,0.4);noise(t,0.05,0.45,'bandpass',1800,900,2);noise(t+0.01,0.18,0.15,'lowpass',900,200,0.7);break;
      case 'foam':noise(t,0.14,0.4,'bandpass',600,2600,1.2);tone('triangle',420,180,t,0.12,0.2);noise(t,0.03,0.3,'highpass',3000,3000,1);break;
      case 'water':for(let i=0;i<4;i++){noise(t+i*0.03,0.06,0.28,'bandpass',1400+i*300,700,3);tone('sine',700+i*120,1300,t+i*0.03,0.05,0.07);}break;
      case 'paint':tone('sine',240,90,t,0.12,0.45);noise(t,0.09,0.4,'bandpass',900,400,1.5);noise(t,0.04,0.2,'highpass',4000,4000,1);break;
      case 'bubble':tone('sine',300,900,t,0.18,0.25);tone('sine',600,1500,t+0.04,0.14,0.12);noise(t,0.12,0.12,'bandpass',2000,3500,4);break;
      case 'laser':tone('sawtooth',1800,220,t,0.16,0.14);tone('square',2400,400,t,0.12,0.05);tone('sine',1200,300,t,0.2,0.18);break;
      case 'plasma':tone('sawtooth',300,1400,t,0.1,0.1);tone('sine',1400,600,t+0.08,0.16,0.2);noise(t,0.14,0.2,'bandpass',2600,5200,3);for(let i=0;i<3;i++)tone('sine',pentaHz(12+i*2),0,t+0.03+i*0.03,0.18,0.05);break;
      case 'mega':tone('sawtooth',110,55,t,0.3,0.25);tone('sine',180,40,t,0.3,0.5);noise(t,0.25,0.3,'lowpass',3000,300,0.8);for(let i=0;i<5;i++)tone('triangle',pentaHz(8+i*2),0,t+i*0.03,0.25,0.06);break;
    }},
  impact(fx,perfect){if(!this.ok())return;const t=now();
    switch(fx){
      case 'wood':noise(t,0.07,0.55,'bandpass',900,500,1.6);tone('sine',260,120,t,0.1,0.35);tone('sine',1568,0,t+0.05,0.45,0.13);tone('sine',2349,0,t+0.09,0.4,0.08);break;
      case 'ceramic':noise(t,0.18,0.5,'highpass',2500,1500,1);for(let i=0;i<6;i++)tone('sine',2400+Math.random()*2600,0,t+Math.random()*0.15,0.12,0.06);tone('sine',500,200,t,0.07,0.2);break;
      case 'glass':noise(t,0.3,0.5,'highpass',3500,2000,0.8);for(let i=0;i<9;i++)tone('sine',3000+Math.random()*4000,0,t+Math.random()*0.3,0.18,0.06);tone('sine',300,120,t,0.08,0.2);
        noise(t+0.04,0.22,0.3,'lowpass',900,250,0.7);break;
      case 'pop':noise(t,0.06,0.8,'highpass',1200,600,0.7);tone('sine',180,60,t,0.1,0.4);noise(t+0.02,0.1,0.15,'bandpass',3000,1500,1);break;
      case 'clang':metal(t,520+Math.random()*80,0.6,0.22);noise(t,0.05,0.35,'bandpass',3000,2000,2);break;
      case 'zap':tone('square',900,200,t,0.18,0.08);noise(t,0.12,0.3,'bandpass',4000,1500,2);tone('sine',1200,300,t+0.1,0.3,0.12);tone('sine',600,150,t+0.25,0.25,0.1);break;
      case 'gold':for(let i=0;i<9;i++)tone('sine',pentaHz(5+i),0,t+i*0.04,0.5,0.1);noise(t,0.5,0.12,'highpass',6000,9000,1);metal(t,1046,0.8,0.08);break;
      case 'boss':tone('sine',130,45,t,0.25,0.6);metal(t,260,0.4,0.16);noise(t,0.1,0.4,'bandpass',1500,500,1);break;
    }
    if(perfect){tone('sine',2637,0,t+0.03,0.5,0.12);tone('sine',3520,0,t+0.08,0.45,0.08);}},
  juice(){if(!this.ok())return;const t=now();noise(t,0.14,0.45,'lowpass',2400,300,1);tone('sine',320,70,t,0.13,0.28);noise(t+0.04,0.2,0.3,'lowpass',700,200,0.7);},
  miss(){if(!this.ok())return;const t=now();tone('sine',150,70,t,0.09,0.32);noise(t,0.12,0.25,'lowpass',600,150,0.8);},
  oops(){if(!this.ok())return;const t=now();tone('triangle',520,500,t,0.16,0.22);tone('triangle',390,330,t+0.2,0.3,0.22);tone('sine',180,520,t+0.5,0.12,0.08);},
  chime(n){if(!this.ok())return;const t=now();const f=pentaHz(5+Math.min(n,14));tone('sine',f,0,t,0.5,0.14);tone('triangle',f*2,0,t,0.22,0.05);},
  whistle(){if(!this.ok())return;const t=now();const o=AC.createOscillator(),g=AC.createGain(),l=AC.createOscillator(),lg=AC.createGain();
    o.type='sine';o.frequency.value=2900;l.frequency.value=38;lg.gain.value=180;l.connect(lg);lg.connect(o.frequency);
    env(g,t,0.02,0.16,0.55);o.connect(g);g.connect(sfxG);o.start(t);l.start(t);o.stop(t+0.6);l.stop(t+0.6);noise(t,0.5,0.06,'bandpass',2900,2900,6);},
  ding(){if(!this.ok())return;const t=now();tone('sine',1568,0,t,0.6,0.18);tone('sine',2349,0,t+0.06,0.6,0.12);},
  starGet(i){if(!this.ok())return;const t=now();const b=[0,4,7][Math.min(2,i)];tone('triangle',mtof(84+b),0,t,0.5,0.16);tone('sine',mtof(96+b),0,t+0.04,0.6,0.08);noise(t,0.3,0.08,'highpass',6000,9000,1);},
  fanfare(){if(!this.ok())return;const t=now();[0,4,7,12,16,19,24].forEach((s,i)=>{const f=392*Math.pow(2,s/12);
    tone('sawtooth',f,0,t+i*0.07,0.35,0.07);tone('triangle',f,0,t+i*0.07,0.5,0.1);});
    [0,4,7,12].forEach(s=>tone('triangle',784*Math.pow(2,s/12),0,t+0.55,0.9,0.07));noise(t+0.5,0.6,0.15,'highpass',5000,9000,1);},
  firework(){if(!this.ok())return;const t=now();noise(t,0.35,0.3,'lowpass',2500,300,1);for(let i=0;i<6;i++)noise(t+0.15+Math.random()*0.35,0.03,0.12,'highpass',4000,4000,1);},
  boom(){if(!this.ok())return;const t=now();tone('sine',90,30,t,0.8,0.8);noise(t,0.8,0.55,'lowpass',1800,120,0.7);metal(t+0.02,180,0.7,0.12);for(let i=0;i<10;i++)noise(t+0.1+Math.random()*0.6,0.04,0.12,'highpass',4000,4000,1);},
  crack(){if(!this.ok())return;const t=now();noise(t,0.08,0.5,'highpass',2000,1200,1);tone('square',200,80,t,0.06,0.08);},
  pop(){if(!this.ok())return;const t=now();tone('sine',500,1100,t,0.07,0.25);noise(t,0.04,0.15,'highpass',3000,3000,1);},
  tap(){if(!this.ok())return;const t=now();tone('sine',700,1000,t,0.06,0.2);},
  locked(){if(!this.ok())return;const t=now();tone('square',220,200,t,0.08,0.06);tone('square',196,180,t+0.1,0.1,0.06);},
  appear(){if(!this.ok())return;const t=now();tone('sine',500,900,t,0.08,0.06);},
};

/* ---------- sporty arcade music ---------- */
const Music={
  bpm:128,step:0,next:0,intense:0,timer:null,

function stageInfo(i){const r=Math.floor(i/STAGES_PER),j=i%STAGES_PER;return {r,j,d:i/(NSTAGE-1),boss:j===STAGES_PER-1};}
function genStage(i){
  const {r,j,d,boss:isBoss}=stageInfo(i);const pool=POOLS[r][j];const main=pool.filter(k=>k!=='decoy');const hasDecoy=pool.includes('decoy');
  const N=isBoss?5+r:20+Math.round(d*16);const maxK=Math.min(4,1+Math.floor(d*3.5+0.6));
  const waves=[];let count=0,wi=0;
  while(count<N){let k=1+Math.floor(Math.random()*maxK);if(wi<1)k=1;k=Math.min(k,N-count);
    // newest kind of this stage gets introduced early
    let kind=main[Math.floor(Math.random()*main.length)];if(wi===1&&main.length>1)kind=main[main.length-1];
    const w=[];for(let q=0;q<k;q++)w.push(Math.random()<0.25&&main.length>1?main[Math.floor(Math.random()*main.length)]:kind);
    if(hasDecoy&&wi>1&&Math.random()<0.28+d*0.18)w.splice(Math.floor(Math.random()*(w.length+1)),0,'decoy');
    if(r>=1&&wi>2&&Math.random()<0.1+d*0.05)w.push('star');
    waves.push(w);count+=k;wi++;}
  let ideal=0;waves.forEach(w=>w.forEach(k=>{if(k==='decoy')return;ideal+=k==='star'?5:(KINDS[k].eye?3:2);}));
  const hp=isBoss?20+r*5:0;
  if(isBoss)ideal+=hp*2;
  const f2=isBoss?0.55+0.03*r:0.40+0.07*d,f3=isBoss?0.85+0.03*r:0.66+0.1*d;
  return {i,r,j,d,isBoss,waves,N,ideal,T2:Math.round(ideal*f2),T3:Math.round(ideal*f3),hp};
}

/* ---------- firing ---------- */
function muzzle(){const w=WEAPONS[S.w];const im=IMG['w_'+w.k];const a=aimA;const left=Math.cos(a)<0;
  const len=L.gunLen;const lx=len*0.68,ly=-len*0.12*(left?-1:1);
  return {x:L.gunX+Math.cos(a)*lx-Math.sin(a)*ly,y:L.gunY+Math.sin(a)*lx+Math.cos(a)*ly};}
function canFire(){return (state==='play'&&!paused&&stage&&!stageDone)||state==='title';}
function judge(x,y,assist){
  let best=null;
  for(const T of targets){if(!targetHittable(T))continue;const c=hitCenter(T);const rr=T.r*assist+6;let d=Math.hypot(x-c.x,y-c.y);
    // fairness: a moving target also counts where it was ~0.12 s ago (finger lag)
    if(T.hist.length>=2){const lx=c.x+T.hist[0]-T.x,ly=c.y+T.hist[1]-T.y;d=Math.min(d,Math.hypot(x-lx,y-ly)*1.02);}
    if(d<=rr){const q=d/rr;if(!best||q<best.q-(T.k==='decoy'?0:0.05))best={T,q,c};}}
  if(best){const q=best.q,eye=best.T.kd.eye;best.grade=best.T.k==='decoy'?'decoy':(eye&&q<0.3?'perfect':q<(eye?0.6:0.5)?'great':'good');return best;}
  return null;}
function fire(x,y,fromAim){
  if(!canFire())return false;if(fireCd>0)return false;const w=WEAPONS[S.w];fireCd=w.cd;stats.shotsFired++;

  if(res&&res.T.k!=='decoy'&&res.T)res.T.claimed=1;

  let tx=x,ty=y;if(res){const c=res.c;tx=c.x+(x-c.x)*0.6;ty=c.y+(y-c.y)*0.6;res.ox=tx-res.T.x;res.oy=ty-res.T.y;}

  const sh={w,x0:mz.x,y0:mz.y,x:mz.x,y:mz.y,tx,ty,t:0,dur,res,bossInfo,col:w.k==='paint'?RAINBOW[Math.floor(Math.random()*7)]:w.col,trail:[],arc:(w.k==='water'||w.k==='paint'||w.k==='bubble')?dist*0.12:0,laser:!w.spd};
  if(bossInfo)sh.bl={x:tx-boss.x,y:ty-boss.y};
  shots.push(sh);
  if(!SIM){Sfx.fire(w.k);muzzleFx(w,mz.x,mz.y,aimA);shake=Math.max(shake,w.k==='mega'?5:2);crosshair=crosshair||null;popups.push({x,y,t:0,reticle:true});}
  if(sh.laser){sh.beamT=0.14;resolveShot(sh);sh.done=true;}

function updateShots(dt){
  for(const s of shots){

    if(s.res&&s.res.T&&!s.res.T.dead){tx=s.res.T.x+s.res.ox;ty=s.res.T.y+s.res.oy;}
    if(s.bl&&boss&&!boss.dead){tx=boss.x+s.bl.x;ty=boss.y+s.bl.y;}
    const k=Math.min(1,s.dur?s.t/s.dur:1);
    s.x=s.x0+(tx-s.x0)*k;s.y=s.y0+(ty-s.y0)*k-Math.sin(k*Math.PI)*s.arc;
    if(!SIM){s.trail.push({x:s.x,y:s.y});if(s.trail.length>10)s.trail.shift();}
    if(k>=1){s.tx=tx;s.ty=ty;resolveShot(s);s.done=true;s.beamT=0;}

function resolveShot(s){const w=s.w;const x=s.tx,y=s.ty;

    if(T.dead||T.dying){/* already gone */ hitTargetLate(T);return;}
    hitTarget(T,x,y,s.res.grade,w,false);

  else if(id==='nextst'){if(revealQ.length){showNextReveal('end');return;}startStage(Math.min(NSTAGE-1,stageIdx+1));}
  else if(id==='music')setMusic(!S.m);
  else if(id==='sound'){setSfx(!S.x);if(S.x)Speech.say('Sound on!',1);}
  else if(id==='fs')toggleFS();
  else if(id==='prev'){mapRange=Math.max(0,mapRange-1);}
  else if(id==='next'){mapRange=Math.min(RANGES.length-1,mapRange+1);}
  else if(id==='revealNext'){Sfx.pop();if(!showNextReveal(reveal.ret)){reveal=null;if(state==='map')mapRange=Math.floor(nextStage()/4);}}
  else if(id.startsWith('st')){const i=+id.slice(2);if(stageOpen(i))startStage(i);else{Sfx.locked();tileWob['st'+i]=1;
      const R=RANGES[Math.floor(i/4)];Speech.say(i%4===0&&!isUnlocked(R)?'Earn more stars! Try for three stars!':'Finish the level before!',1,1.4,1.0);}}
  else if(id.startsWith('tab'))pickTab=+id.slice(3);
  else if(id.startsWith('it:')){const [,tp,ix]=id.split(':');const list=tp==='0'?WEAPONS:TSETS;const it=list[+ix];
    if(isUnlocked(it)){if(tp==='0')S.w=+ix;else S.t=+ix;save();Sfx.pop();Speech.say(it.name+'!',1,1.4,1.0);sparkles(b.x,b.y,16,'#fff4a0',240);if(tp==='0')Sfx.fire(it.k);}
    else{Sfx.locked();tileWob[tp+':'+ix]=1;Speech.say('Earn more stars to unlock!',1,1.4,1.0);}}
}

/* ---------- main loop ---------- */
let last=0,qCheck=0;const frameLog=[];
function frame(ts){
  requestAnimationFrame(frame);
  const rdt=Math.min(0.05,last?(ts-last)/1000:0.016);const raw=last?ts-last:16;last=ts;
  stats.frames++;stats.sum+=raw;stats.max=Math.max(stats.max,raw);frameLog.push(raw);if(frameLog.length>120)frameLog.shift();
  qCheck+=rdt;if(qCheck>2.5&&state==='play'){qCheck=0;const avg=frameLog.reduce((a,b)=>a+b,0)/frameLog.length;if(avg>24&&Q>0){Q--;resize();}}
  let dt=rdt;if(freeze>0){freeze-=rdt;dt=0;}else if(slowT>0){slowT-=rdt;dt=rdt*slowK;}
  if(state==='reveal'||paused)dt=0;
  try{update(dt,rdt);render();}catch(err){stats.errors++;if(stats.errors<4)console.error(err);}
}
/* ---------- headless difficulty bot ---------- */
function gauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function simulate(i,bot,wIdx){
  const saved=JSON.stringify(S),st0=state;SIM=true;const ow=S.w;S.w=wIdx==null?S.w:wIdx;S.x=0;
  startStage(i);const dt=1/60;let t=0,busy=0.6,pending=null,seen=new Map();
  while(state==='play'&&t<240){
    // perception
    for(const T of targets)if(!seen.has(T))seen.set(T,{t,dec:Math.random()>bot.avoid});
    if(pending&&t>=pending.at){fire(pending.x,pending.y);pending=null;busy=t+bot.gap[0]+Math.random()*(bot.gap[1]-bot.gap[0]);}
    if(!pending&&t>=busy){
      const cand=targets.filter(T=>targetHittable(T)&&t-seen.get(T).t>=bot.react[0]+Math.random()*(bot.react[1]-bot.react[0])&&T.x>L.px0*0.5&&T.x<W-L.px0*0.5&&T.y>0);
      let pick=null;const c2=cand.filter(T=>T.k!=='decoy'||seen.get(T).dec);
      if(boss&&boss.ph==='fight'&&!boss.dying&&!boss.dead&&(c2.length===0||Math.random()<0.6)){const sp=bossSpotsWorld();const s=sp[Math.floor(Math.random()*sp.length)];pick={x:s.x,y:s.y};}
      else if(c2.length){const T=c2[Math.floor(Math.random()*c2.length)];pick=hitCenter(T);if(T.k==='decoy')seen.get(T).dec=false;}
      if(pick){const sg=bot.sigma*L.m;pending={x:pick.x+gauss()*sg,y:pick.y+gauss()*sg,at:t+bot.motor};}
      else if(Math.random()<bot.stray*dt){pending={x:L.px0+Math.random()*(L.px1-L.px0),y:L.py0+Math.random()*(L.py1-L.py0),at:t};}
      else busy=t+0.05;}
    let d2=dt;if(freeze>0){freeze-=dt;d2=0;}else if(slowT>0){slowT-=dt;d2=dt*slowK;}
    gt+=d2;fireCd-=dt;updateStage(d2);updateTargets(d2);updateBoss(d2);updateShots(d2);t+=dt;}
  const res={stage:i+1,stars:endStars,pts,T2:stage.T2,T3:stage.T3,hits:stats.hits,miss:stats.miss,decoy:stats.decoy,escaped:stats.escaped,perfect:stats.perfect,N:stage.N,dur:+t.toFixed(1),bossHits:stats.bossHits,boss:stage.isBoss};
  SIM=false;Object.assign(S,JSON.parse(saved));S.w=ow;clearPlay();stage=null;state=st0==='play'?'title':st0;freeze=0;slowT=0;stageDone=false;
  return res;}
function prewarm(){try{TSETS.forEach(t=>['bull','popup','spring','duck','drone'].forEach(k=>targetSprite(k,t.hue)));
  BALLOON_HUES.forEach(h=>tinted('t_balloon',h[0]));JUICE_HUES.forEach(h=>tinted('t_bottle',h[0]));RANGES.forEach(r=>tinted(BOSS_DEF[r.boss].img,r.bossHue));glassSprite();
  const tmp=[];for(let i=0;i<24;i++)tmp.push(shardCanvas(128,128));tmp.forEach(c=>c._used=false);RAINBOW.concat(['#ffffff','#4fd2ff','#5fd6ff','#6fdcff','#ff9a1a']).forEach(c=>{dropSprite(c);glowSprite(c);});}catch(e){}}
document.addEventListener('visibilitychange',()=>{try{if(document.hidden){if(state==='play')paused=true;Speech.stop();if(AC&&AC.state==='running')AC.suspend();}
  else if(AC&&AC.state==='suspended')AC.resume();}catch(e){}});
function boot(){
  loadSave();resize();
  loadImages(p=>{loadP=p;},()=>{prewarm();state='title';titleSpawn=0.3;});
  requestAnimationFrame(frame);
  window.__game={S,stats,get state(){return state;},get paused(){return paused;},targets:()=>targets,buttons:()=>buttons,get boss(){return boss;},get stage(){return stage;},
    get pts(){return pts;},get combo(){return combo;},revealQ:()=>revealQ,get reveal(){return reveal;},L:()=>L,
    spawn(k,x,y){const T=spawnTarget(k,{});if(x!=null){T.x=x;T.y=y;T.bx=x;T.vx=0;T.vy=0;T.g=0;T.life=99;T.ph='live';T.sc=1;if(T.ax!=null){T.ax=x;T.ay=y;T.amp=0;}}return T;},
    hitCenter,startStage,endNow(){if(stage){waveI=stage.waves.length;spawnQ=[];for(const T of targets)T.dead=true;if(boss){boss.dead=true;}}},
    killBoss(){if(boss){boss.hp=1;}},hash:hashString,saveNow,get Q(){return Q;},imgs:()=>Object.keys(IMG).filter(k=>IMG[k]).length,
    imgFromDom:()=>Object.keys(IMG).filter(k=>IMG[k]&&IMG[k].id==='img-'+k).length,frameLog:()=>frameLog.slice(),simulate,genStage,
    bossSpots:()=>boss?bossSpotsWorld():[],fire,set fireCd(v){fireCd=v;}};
}
boot();

</script>
