    <script>
/* ToyBand v1: a tiny preschool-TV style music engine for Alex's games.

  /* melody text: one token per `res` sixteenths; note (C5, F#4, C5+E5 chord), '-' hold, '.' rest */
  function parseMel(str, res) {
    var tk = str.split(/[\s|]+/).filter(function (x) { return x; }), ev = [], last = null;
    for (var i = 0; i < tk.length; i++) {

    uke: function () { return ks(392, 1.1, 0.75, 0.9965, 0); },
    pizz: function () { return ks(660, 0.5, 0.45, 0.988, 0.13); },
    upright: function () { return ks(98, 0.9, 0.3, 0.996, 0.35); },

    flute: function () { return sus(587, [1, 0.12, 0.06, 0.02], 0.011, 5, 0.5, 0.04); },
    kick: function () { var R = DR, d = arr(0.45, R), ph = 0; for (var i = 0; i < d.length; i++) { var t = i / R, f = 48 + 120 * Math.exp(-t / 0.035); ph += 2 * Math.PI * f / R;

    snare: function () { var R = DR, d = arr(0.32, R), n = arr(0.32, R), i; for (i = 0; i < n.length; i++) n[i] = rnd(); filt(n, "hp", 1200, 0.7, R); filt(n, "lp", 9000, 0.7, R);
      for (i = 0; i < d.length; i++) { var t = i / R; d[i] = 0.55 * Math.sin(2 * Math.PI * (180 + 60 * Math.exp(-t / 0.02)) * t) * Math.exp(-t / 0.05) + 0.8 * n[i] * Math.exp(-t / 0.1); } return { d: norm(d, 1), R: R }; },
    clap: function () { var R = DR, d = arr(0.3, R), i; for (i = 0; i < d.length; i++) { var t = i / R, e = 0; for (var k = 0; k < 3; k++) { var tt = t - k * 0.011; if (tt >= 0 && tt < 0.012) e = Math.max(e, Math.exp(-tt / 0.004)); }

    tamb: function () { var R = DR, d = arr(0.3, R), i; for (i = 0; i < d.length; i++) { var t = i / R; d[i] = rnd() * (Math.exp(-t / 0.06) + (t > 0.025 ? 0.5 * Math.exp(-(t - 0.025) / 0.07) : 0)); } filt(d, "hp", 6500, 0.8, R);
      for (i = 0; i < d.length; i++) { var t2 = i / R; d[i] += 0.25 * Math.exp(-t2 / 0.09) * (Math.sin(2 * Math.PI * 5400 * t2) + Math.sin(2 * Math.PI * 7300 * t2) * 0.7 + Math.sin(2 * Math.PI * 9100 * t2) * 0.5); } return { d: norm(d, 1), R: R }; },
    shaker: function () { var R = DR, d = arr(0.14, R), i; for (i = 0; i < d.length; i++) { var t = i / R; d[i] = rnd() * Math.min(1, t / 0.02) * Math.exp(-Math.max(0, t - 0.02) / 0.035); } filt(d, "hp", 5000, 0.7, R); return { d: norm(d, 1), R: R }; },
    hat: function () { var R = DR, d = arr(0.12, R), i; for (i = 0; i < d.length; i++) { var t = i / R; d[i] = rnd() * Math.exp(-t / 0.025); } filt(d, "hp", 7500, 0.8, R); return { d: norm(d, 1), R: R }; },
    wood: function () { var R = DR, d = arr(0.15, R); for (var i = 0; i < d.length; i++) { var t = i / R; d[i] = Math.exp(-t / 0.028) * (Math.sin(2 * Math.PI * 1750 * t) + 0.35 * Math.sin(2 * Math.PI * 4400 * t) * Math.exp(-t / 0.01)) + (t < 0.002 ? rnd() * 0.4 : 0); } return { d: norm(d, 1), R: R }; },
    crash: function () { var R = DR, d = arr(1.7, R), i; for (i = 0; i < d.length; i++) { var t = i / R; d[i] = rnd() * (0.6 * Math.exp(-t / 0.55) + 0.4 * Math.exp(-t / 0.08)); } filt(d, "hp", 4200, 0.6, R); return { d: norm(d, 1), R: R }; },
    taiko: function () { var R = DR, d = arr(0.8, R), n = arr(0.8, R), ph = 0, i; for (i = 0; i < n.length; i++) n[i] = rnd(); filt(n, "lp", 500, 0.8, R);

    tom: function () { var R = DR, d = arr(0.45, R), ph = 0; for (var i = 0; i < d.length; i++) { var t = i / R; ph += 2 * Math.PI * (130 + 80 * Math.exp(-t / 0.04)) / R; d[i] = Math.sin(ph) * Math.exp(-t / 0.16) + (t < 0.01 ? rnd() * 0.3 : 0); } return { d: norm(d, 1), R: R }; },
    tri: function () { var R = DR, d = arr(1.1, R); for (var i = 0; i < d.length; i++) { var t = i / R; d[i] = Math.min(1, t / 0.001) * Math.exp(-t / 0.35) * (Math.sin(2 * Math.PI * 2650 * t) + 0.5 * Math.sin(2 * Math.PI * 6950 * t) + 0.3 * Math.sin(2 * Math.PI * 10300 * t)); } return { d: norm(d, 1), R: R }; },
    noise: function () { var R = DR, d = arr(0.6, R); for (var i = 0; i < d.length; i++) d[i] = rnd(); return { d: d, R: R }; }
  };
