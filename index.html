<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Alex's Arcade</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1b1446">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Alex's Arcade">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#1b1446;color:#fff;font-family:system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body{background:
  radial-gradient(120% 80% at 50% 0%,#4a2fa8 0%,#2a1d78 38%,#1b1446 70%,#120c33 100%) fixed;
  min-height:100vh;min-height:100dvh}
.sky{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.sky i{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;opacity:.0;animation:tw 3.2s ease-in-out infinite;box-shadow:0 0 10px 2px currentColor}
@keyframes tw{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:.9;transform:scale(1)}}
main{position:relative;padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));
  display:flex;flex-direction:column;align-items:center;gap:clamp(14px,3vmin,28px)}
.logo{width:min(78vw,46vh,440px);aspect-ratio:1;border-radius:13%;overflow:hidden;display:block;
  box-shadow:0 0 0 3px rgba(255,255,255,.12),0 14px 40px rgba(0,0,0,.45),0 0 60px rgba(140,90,255,.45);
  animation:bob 4s ease-in-out infinite}
.logo img{width:100%;height:100%;display:block}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-6px) rotate(1deg)}}
.grid{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(14px,3.2vmin,30px);width:100%;max-width:1400px}
.tile{--s:min(41vw,300px);width:var(--s);height:var(--s);border-radius:22%;display:block;position:relative;
  box-shadow:0 0 0 4px rgba(255,255,255,.85),0 0 0 9px var(--c),0 16px 30px rgba(0,0,0,.5);
  transition:transform .12s ease;touch-action:manipulation;animation:pop .5s cubic-bezier(.3,1.6,.5,1) backwards}
.tile:nth-child(2){animation-delay:.08s}.tile:nth-child(3){animation-delay:.16s}.tile:nth-child(4){animation-delay:.24s}.tile:nth-child(5){animation-delay:.32s}.tile:nth-child(6){animation-delay:.4s}
.tile img{width:100%;height:100%;border-radius:22%;display:block;pointer-events:none}
.tile:active,.tile.go{transform:scale(.9) rotate(-2deg)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@media (orientation:landscape){
  main{gap:clamp(10px,2.4vh,22px)}
  .logo{width:min(34vh,30vw,320px)}
  .tile{--s:min(21vw,50vh,300px)}
}
@media (prefers-reduced-motion:reduce){.logo,.tile,.sky i{animation:none}.sky i{opacity:.5}}
</style>
</head>
<body>
<div class="sky" aria-hidden="true"></div>
<main>
  <div class="logo"><img src="logo.webp" alt="Alex's Arcade" draggable="false"></div>
  <nav class="grid">
    <a class="tile" href="spidey-attack/" aria-label="Spidey Attack!" style="--c:#c8102e"><img src="spidey-attack/icon-512.png" alt="Spidey Attack!" draggable="false"></a>
    <a class="tile" href="juicy-chop/" aria-label="Juicy Chop!" style="--c:#ffb84d"><img src="juicy-chop/icon-512.png" alt="Juicy Chop!" draggable="false"></a>
    <a class="tile" href="hero-race/" aria-label="Hero Race" style="--c:#1e88e5"><img src="hero-race/icon-512.png" alt="Hero Race" draggable="false"></a>
    <a class="tile" href="bullseye-blast/" aria-label="Bullseye Blast!" style="--c:#3fa9f5"><img src="bullseye-blast/icon-512.png" alt="Bullseye Blast!" draggable="false"></a>
    <a class="tile" href="turbo-toy-racers/" aria-label="Turbo Toy Racers" style="--c:#e8202a"><img src="turbo-toy-racers/icon-512.png" alt="Turbo Toy Racers" draggable="false"></a>
    <a class="tile" href="bolt-buddy/" aria-label="Bolt Buddy" style="--c:#4da6ff"><img src="bolt-buddy/icon-512.png" alt="Bolt Buddy" draggable="false"></a>
  </nav>
</main>
<script>
(function(){
  var sky=document.querySelector('.sky'),cols=['#ffd23f','#7cf','#ff7ac6','#9f7bff','#fff'];
  for(var i=0;i<34;i++){var s=document.createElement('i');s.style.left=(Math.random()*100)+'%';s.style.top=(Math.random()*100)+'%';
    s.style.color=cols[i%5];s.style.background=cols[i%5];s.style.animationDelay=(Math.random()*3.2)+'s';var z=3+Math.random()*5;s.style.width=s.style.height=z+'px';sky.appendChild(s);}
  document.addEventListener('contextmenu',function(e){e.preventDefault();});
  var ac=null;
  function blip(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();var t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
    o.type='triangle';o.frequency.setValueAtTime(520,t);o.frequency.exponentialRampToValueAtTime(1200,t+.12);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.18);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.2);}catch(e){}}
  [].forEach.call(document.querySelectorAll('.tile'),function(a){
    a.addEventListener('click',function(e){e.preventDefault();if(a.classList.contains('go'))return;a.classList.add('go');blip();
      setTimeout(function(){location.href=a.getAttribute('href');},170);});
  });
  window.addEventListener('pageshow',function(){[].forEach.call(document.querySelectorAll('.tile.go'),function(a){a.classList.remove('go');});});
  if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
})();
</script>
</body>
</html>
