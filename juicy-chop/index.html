<script>
'use strict';
/* ===== Juicy Chop! — core data, save, audio, speech ===== */
const FRUITS=[
 {k:'watermelon',name:'Watermelon',syl:'Wa-ter-mel-on',juice:'#ff3b5c',size:1.22,req:0},
 {k:'orange',name:'Orange',syl:'Or-ange',juice:'#ff9a1a',size:1,req:0},
 {k:'kiwi',name:'Kiwi',syl:'Kee-wee',juice:'#8fd14f',size:0.95,req:0},
 {k:'strawberry',name:'Strawberry',syl:'Straw-ber-ry',juice:'#ff2d55',size:0.95,req:0},
 {k:'banana',name:'Banana',syl:'Ba-na-na',juice:'#ffe14d',size:1.1,req:0},
 {k:'pineapple',name:'Pineapple',syl:'Pine-ap-ple',juice:'#ffd23f',size:1.25,req:0},
 {k:'apple',name:'Apple',syl:'Ap-ple',juice:'#ffe9a8',size:0.98,req:0},
 {k:'grapes',name:'Grapes',syl:'Grapes',juice:'#a45bff',size:1.08,req:0},
 {k:'coconut',name:'Coconut',syl:'Co-co-nut',juice:'#ffffff',size:1.05,req:0},
 {k:'dragonfruit',name:'Dragon fruit',syl:'Dra-gon-fruit',juice:'#ff4fa3',size:1.12,req:0},
 {k:'peach',name:'Peach',syl:'Peeeach',juice:'#ffb066',size:1,req:35},
 {k:'cherry',name:'Cherry',syl:'Cher-ry',juice:'#d0103a',size:0.9,req:80},
 {k:'lemon',name:'Lemon',syl:'Lem-on',juice:'#fff35c',size:0.95,req:130},
 {k:'pear',name:'Pear',syl:'Pear',juice:'#e6f28a',size:1,req:190},
 {k:'mango',name:'Mango',syl:'Man-go',juice:'#ffa31a',size:1.05,req:260},
 {k:'plum',name:'Plum',syl:'Plum',juice:'#b0337a',size:0.92,req:340},
 {k:'pomegranate',name:'Pomegranate',syl:'Pom-e-gran-ate',juice:'#e0103a',size:1.05,req:430},
 {k:'blueberry',name:'Blueberry',syl:'Blue-ber-ry',juice:'#5566e0',size:0.85,req:530},
];
const SPECIAL={gold:{k:'gold',img:'s_gold',juice:'#ffd23f',size:1.05},rainbow:{k:'rainbow',img:'s_rainbow',juice:'#ff66cc',size:1.1},
 broccoli:{k:'broccoli',img:'s_broccoli',juice:'#4caf50',size:1.1,veg:1},onion:{k:'onion',img:'s_onion',juice:'#b36bd6',size:1.0,veg:1}};
const CHARS=[
 {k:'pip',name:'Pip the Bunny Ninja',req:0},{k:'momo',name:'Momo Panda',req:2},{k:'tank',name:'Tank the Bulldog',req:4},
 {k:'ziggy',name:'Ziggy Robot',req:7},{k:'rex',name:'Rex the Tiny Dino',req:10},{k:'luna',name:'Luna Cat Ninja',req:14},
 {k:'bruno',name:'Bruno Bear',req:18},{k:'kiki',name:'Kiki the Koala Pirate',req:23},{k:'thunder',name:'Thunder Pup',req:28}];
const WEAPONS=[
 {k:'wood',name:'Wooden Sword',req:0,glow:'#ffcf7a',core:'#fff6dc',w:16,style:'normal'},
 {k:'ninja',name:'Ninja Blade',req:1,glow:'#39e6d0',core:'#ffffff',w:13,style:'normal'},
 {k:'laser',name:'Laser Sword',req:5,glow:'#22d3ff',core:'#eaffff',w:15,style:'laser'},
 {k:'pizza',name:'Pizza Cutter',req:8,glow:'#ff5a3c',core:'#ffe9a0',w:15,style:'dash'},
 {k:'wand',name:'Magic Wand',req:12,glow:'#c060ff',core:'#fff0ff',w:14,style:'sparkle'},
 {k:'claw',name:'Dino Claw',req:16,glow:'#4be08a',core:'#f4fff4',w:8,style:'claw'},
 {k:'rainbow',name:'Rainbow Sword',req:21,glow:'#ff66cc',core:'#ffffff',w:16,style:'rainbow'}];
const BGS=[
 {k:'treehouse',name:'Tree House',req:0,mote:'leaf',tint:'#ffe9a8'},{k:'beach',name:'Beach',req:3,mote:'bubble',tint:'#bff4ff'},
 {k:'candy',name:'Candy Land',req:6,mote:'sprinkle',tint:'#ffd0ec'},{k:'jungle',name:'Jungle',req:11,mote:'firefly',tint:'#e6ffb0'},
 {k:'space',name:'Space',req:15,mote:'star',tint:'#d8c8ff'}];
// unlock bit layout in S.u: chars 0-8, weapons 9-15, bgs 16-20
const UNLOCKS=[];
CHARS.forEach((c,i)=>UNLOCKS.push({type:'char',idx:i,bit:i,req:c.req,item:c}));
WEAPONS.forEach((c,i)=>UNLOCKS.push({type:'weapon',idx:i,bit:9+i,req:c.req,item:c}));
BGS.forEach((c,i)=>UNLOCKS.push({type:'bg',idx:i,bit:16+i,req:c.req,item:c}));
const ROUND_LEN=65, STAR2=20, STAR3=40, FREE_STAR_EVERY=25;

/* ---------- save in URL hash ---------- */
const S={s:0,f:0,c:0,w:0,b:0,a:0,m:1,x:1,i:0,u:0,r:0};
const BITKEYS={i:1,u:1};
function loadSave(){
  try{
    const h=String(location.hash||'').replace(/^#/,'');
    h.split('&').forEach(p=>{const kv=p.split('=');const k=kv[0];if(!(k in S))return;
      const n=parseInt(kv[1],BITKEYS[k]?36:10);if(isFinite(n)&&n>=0)S[k]=n;});
  }catch(e){}
  S.c=Math.min(S.c,CHARS.length-1);S.w=Math.min(S.w,WEAPONS.length-1);S.b=Math.min(S.b,BGS.length-1);
  if(!isUnlocked(CHARS[S.c]))S.c=0; if(!isUnlocked(WEAPONS[S.w]))S.w=0; if(!isUnlocked(BGS[S.b]))S.b=0;
  UNLOCKS.forEach(u=>{if(u.req===0)S.u|=(1<<u.bit);});
}
let saveTimer=0;
function hashString(){return Object.keys(S).map(k=>k+'='+(BITKEYS[k]?S[k].toString(36):S[k])).join('&');}
function saveNow(){
  const h='#'+hashString();
  try{history.replaceState(null,'',h);}catch(e){try{location.hash=h;}catch(e2){}}
}
function save(){clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,250);}
function isUnlocked(item){return !!S.a||S.s>=item.req;}
function fruitAvail(i){return !!S.a||S.f>=FRUITS[i].req;}

/* ---------- audio ---------- */
let AC=null,master=null,musicG=null,sfxG=null,noiseBuf=null;
function initAudio(){
  if(AC){if(AC.state==='suspended'){try{AC.resume();}catch(e){}}return;}
  const C=window.AudioContext||window.webkitAudioContext; if(!C)return;
  try{AC=new C();}catch(e){AC=null;return;}
  const comp=AC.createDynamicsCompressor();comp.threshold.value=-16;comp.knee.value=12;comp.ratio.value=4;comp.attack.value=0.003;comp.release.value=0.2;
  comp.connect(AC.destination);
  master=AC.createGain();master.gain.value=0.9;master.connect(comp);
  musicG=AC.createGain();musicG.gain.value=S.m?0.34:0;musicG.connect(master);
  sfxG=AC.createGain();sfxG.gain.value=S.x?0.85:0;sfxG.connect(master);
  noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
  const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  Music.reset();
}
function setMusic(on){S.m=on?1:0;if(musicG)musicG.gain.setTargetAtTime(on?0.34:0,AC.currentTime,0.05);save();}
function setSfx(on){S.x=on?1:0;if(sfxG)sfxG.gain.setTargetAtTime(on?0.85:0,AC.currentTime,0.05);if(!on)Speech.stop();save();}
function now(){return AC?AC.currentTime:0;}
function env(g,t,a,peak,dur){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);}
function tone(type,f0,f1,t,dur,vol,dest,att){
  if(!AC)return null;const o=AC.createOscillator(),g=AC.createGain();o.type=type;
  o.frequency.setValueAtTime(f0,t);if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  env(g,t,att||0.005,vol,dur);o.connect(g);g.connect(dest||sfxG);o.start(t);o.stop(t+dur+0.05);return o;
}
function noise(t,dur,vol,ftype,f0,f1,q,dest,att){
  if(!AC)return;const s=AC.createBufferSource();s.buffer=noiseBuf;
  s.playbackRate.value=0.7+Math.random()*0.6;
  const f=AC.createBiquadFilter();f.type=ftype||'bandpass';f.frequency.setValueAtTime(f0,t);
  if(f1&&f1!==f0)f.frequency.exponentialRampToValueAtTime(f1,t+dur);f.Q.value=q||1;
  const g=AC.createGain();env(g,t,att||0.004,vol,dur);s.connect(f);f.connect(g);g.connect(dest||sfxG);
  s.start(t,Math.random()*0.5);s.stop(t+dur+0.05);
}
const PENTA=[0,2,4,7,9];
function pentaHz(i,base){const o=Math.floor(i/5),d=((i%5)+5)%5;return (base||587.33)*Math.pow(2,(PENTA[d]+12*o)/12);}
const Sfx={
  lastWhoosh:0,
  whoosh(wk){
    if(!AC||!S.x)return;const t=now();if(t-this.lastWhoosh<0.13)return;this.lastWhoosh=t;
    switch(wk){
      case 'wood':noise(t,0.18,0.35,'bandpass',500,1400,1.2);tone('sine',260,180,t,0.08,0.15);break;
      case 'ninja':noise(t,0.16,0.35,'highpass',2500,6000,0.8);tone('sine',2400,3000,t,0.12,0.05);break;
      case 'laser':tone('sawtooth',95,150,t,0.28,0.12);tone('sine',440,520,t,0.28,0.08);noise(t,0.2,0.12,'bandpass',900,1800,3);break;
      case 'pizza':for(let i=0;i<5;i++)noise(t+i*0.03,0.03,0.25,'bandpass',3000,3000,4);noise(t,0.16,0.2,'bandpass',800,1600,1);break;
      case 'wand':for(let i=0;i<4;i++)tone('sine',pentaHz(10+Math.floor(Math.random()*6)),0,t+i*0.04,0.25,0.07);noise(t,0.15,0.12,'highpass',4000,7000,1);break;
      case 'claw':for(let i=0;i<3;i++)noise(t+i*0.035,0.09,0.3,'bandpass',1400,400,2);tone('sawtooth',90,70,t,0.15,0.06);break;
      case 'rainbow':noise(t,0.18,0.3,'bandpass',700,2400,1);for(let i=0;i<3;i++)tone('triangle',pentaHz(5+i*2),0,t+i*0.04,0.2,0.07);break;
    }
  },
  slice(intensity,wk){
    if(!AC||!S.x)return;const t=now();
    noise(t,0.12,0.55,'lowpass',2600,300,1);           // squish
    tone('sine',340,70,t,0.13,0.35);                    // squelch body
    noise(t+0.03,0.22,0.35,'lowpass',700,200,0.7);       // splat
    tone('sine',900+Math.random()*300,1600,t,0.05,0.12); // pop
    if(wk==='laser')tone('sawtooth',300,120,t,0.12,0.06);
    if(wk==='wand')tone('sine',2093,2637,t,0.18,0.06);
  },
  chime(n){if(!AC||!S.x)return;const t=now();const f=pentaHz(5+Math.min(n,12));
    tone('sine',f,0,t,0.55,0.16);tone('triangle',f*2,0,t,0.25,0.05);},
  raspberry(){if(!AC||!S.x)return;const t=now();
    const o=AC.createOscillator(),g=AC.createGain(),lfo=AC.createOscillator(),lg=AC.createGain(),f=AC.createBiquadFilter();
    o.type='sawtooth';o.frequency.setValueAtTime(140,t);o.frequency.linearRampToValueAtTime(95,t+0.55);
    lfo.type='square';lfo.frequency.value=26;lg.gain.value=0.5;lfo.connect(lg);
    f.type='lowpass';f.frequency.value=1100;f.Q.value=3;
    const am=AC.createGain();am.gain.value=0.5;lg.connect(am.gain);
    env(g,t,0.02,0.4,0.6);o.connect(f);f.connect(am);am.connect(g);g.connect(sfxG);
    o.start(t);lfo.start(t);o.stop(t+0.65);lfo.stop(t+0.65);
    tone('sine',220,520,t+0.45,0.18,0.12);},
  boing(){if(!AC||!S.x)return;const t=now();tone('sine',180,520,t,0.12,0.2);tone('sine',520,200,t+0.12,0.2,0.18);},
  pop(){if(!AC||!S.x)return;const t=now();tone('sine',500,1100,t,0.07,0.25);noise(t,0.04,0.15,'highpass',3000,3000,1);},
  ding(){if(!AC||!S.x)return;const t=now();tone('sine',1568,0,t,0.6,0.18);tone('sine',2349,0,t+0.06,0.6,0.12);},
  fanfare(){if(!AC||!S.x)return;const t=now();[0,4,7,12,16,19,24].forEach((s,i)=>{const f=392*Math.pow(2,s/12);
    tone('sawtooth',f,0,t+i*0.07,0.35,0.07);tone('triangle',f,0,t+i*0.07,0.5,0.1);});
    [0,4,7,12].forEach(s=>tone('triangle',784*Math.pow(2,s/12),0,t+0.55,0.9,0.07));noise(t+0.5,0.6,0.15,'highpass',5000,9000,1);},
  firework(){if(!AC||!S.x)return;const t=now();noise(t,0.35,0.3,'lowpass',2500,300,1);
    for(let i=0;i<6;i++)noise(t+0.15+Math.random()*0.35,0.03,0.12,'highpass',4000,4000,1);},
  golden(){if(!AC||!S.x)return;const t=now();for(let i=0;i<8;i++)tone('sine',pentaHz(5+i),0,t+i*0.045,0.5,0.1);noise(t,0.5,0.12,'highpass',6000,9000,1);},
  tap(){if(!AC||!S.x)return;const t=now();tone('sine',700,1000,t,0.06,0.2);},
  locked(){if(!AC||!S.x)return;const t=now();tone('square',220,200,t,0.08,0.06);tone('square',196,180,t+0.1,0.1,0.06);},
};

/* ---------- kid-ninja music ---------- */
const Music={
  bpm:126, step:0, next:0, intense:0, timer:null,
  // phrases: [step, scaleIndex (0 = D5 area), len]
  P:[
   [[0,2,2],[2,3,2],[4,4,4],[8,3,2],[10,2,2],[12,0,4],[16,1,2],[18,2,2],[20,3,2],[22,2,2],[24,1,4],[28,0,4]],
   [[0,5,3],[3,4,1],[4,3,2],[6,2,2],[8,3,4],[12,4,4],[16,5,2],[18,6,2],[20,5,2],[22,4,2],[24,3,6],[30,4,2]],
   [[0,0,2],[2,0,2],[4,2,2],[6,3,2],[8,4,6],[14,3,2],[16,2,2],[18,3,2],[20,2,2],[22,0,2],[24,-1,4],[28,0,4]],
   [[0,4,1],[1,5,1],[2,4,2],[4,3,2],[6,4,2],[8,7,4],[12,5,4],[16,4,2],[18,3,2],[20,2,2],[22,3,2],[24,2,4],[28,0,4]]],
  ORDER:[0,1,0,2,3,1,2,0],
  ROOTS:[0,5,2,7], // semitone offsets from D (D, G, E, A)
  reset(){this.step=0;if(AC)this.next=AC.currentTime+0.1;if(!this.timer)this.timer=setInterval(()=>this.tick(),30);},
  tick(){
    if(!AC||AC.state!=='running')return;
    const t0=AC.currentTime;if(this.next<t0-0.25)this.next=t0+0.05;
    const sd=60/this.bpm/4;
    while(this.next<t0+0.14){if(S.m)this.play(this.step,this.next,sd);this.next+=sd;this.step=(this.step+1)%(16*16);}
  },
  play(st,t,sd){
    const bar=Math.floor(st/16),s=st%16,I=this.intense, D=musicG;
    // taiko
    if(s===0||s===8||(s===11)||(s===14&&bar%2===1)){taiko(t,s===0?1:0.7);}
    if(I&&(s===4||s===12||s===6))taiko(t,0.55);
    // shime / small drum
    if(s%4===2||(I&&s%2===1))shime(t,I?0.22:0.16);
    if(s===0&&bar%4===0)clack(t);
    // shamisen bass ostinato (8ths)
    const root=this.ROOTS[bar%4];
    if(s%2===0){const pat=[0,7,12,7,0,7,10,7];const sem=root+pat[(s/2)%8];shamisen(t,146.83*Math.pow(2,sem/12),I?0.2:0.16);}
    // koto arpeggio sparkles
    if(I?(s%2===1):(s===3||s===7||s===15)){koto(t,pentaHz(5+((st*3)%7)+(I?3:0),587.33),I?0.08:0.06);}
    // flute lead
    const ph=this.P[this.ORDER[Math.floor(bar/2)%this.ORDER.length]];const ls=(bar%2)*16+s;
    for(const n of ph)if(n[0]===ls)flute(t,pentaHz(n[1]+5+(I?5:0),293.66),n[2]*sd,0.13);
    // vocal shouts

/* ---------- fruit spawning ---------- */
function introducedList(){const a=[];FRUITS.forEach((f,i)=>{if(fruitAvail(i)&&(S.i>>i&1))a.push(i);});return a;}
function pickFruit(allowIntro){
  if(allowIntro){const un=[];FRUITS.forEach((f,i)=>{if(fruitAvail(i)&&!(S.i>>i&1))un.push(i);});
    const intro=introducedList();
    if(un.length&&(gt-lastIntro>3.2||intro.length===0)){lastIntro=gt;return {i:un[0],intro:true};}
    if(intro.length)return {i:intro[Math.floor(Math.random()*intro.length)],intro:false};
    return {i:un[0],intro:true};}
  const av=[];FRUITS.forEach((f,i)=>{if(fruitAvail(i))av.push(i);});return {i:av[Math.floor(Math.random()*av.length)],intro:false};
}
function makeFruit(def,x,y,vx,vy){
  const f={def,x,y,vx,vy,rot:Math.random()*6,vr:(Math.random()-0.5)*2.4,r:L.fr*def.size,age:0,alive:true,wob:0,vegCd:0,intro:false,gscale:1};
  fruits.push(f);return f;}
function toss(def,opt){
  opt=opt||{};const g=H*1.0;const x=opt.x!=null?opt.x:W*(0.18+Math.random()*0.64);
  const top=H*(0.12+Math.random()*0.2);const h=H+L.fr-top;const vy=-Math.sqrt(2*g*h);const tAir=2*(-vy)/g;
  const vx=((W*0.5-x)*(0.4+Math.random()*0.8))/tAir+(Math.random()-0.5)*W*0.08;
  const f=makeFruit(def,x,H+L.fr*1.2,vx,vy);return f;}
function spawnFruit(allowIntro,opt){
  const pf=pickFruit(allowIntro);const def=FRUITS[pf.i];const f=toss(def,opt);f.fi=pf.i;
  if(pf.intro&&allowIntro){f.intro=true;S.i|=(1<<pf.i);save();
    Speech.say((def.req>0?'New fruit! ':'Here comes ')+def.name+'!',2,1.3,1.0);
    setTimeout(()=>{if(f.alive)sparkles(f.x,f.y,20,'#fff7b0',260);},350);Sfx.ding();}
  return f;}
function spawnSpecial(k,opt){const f=toss(SPECIAL[k],opt);return f;}
function rainFruit(){const pf=pickFruit(false);const il=introducedList();const i=il.length?il[Math.floor(Math.random()*il.length)]:pf.i;
  const f=makeFruit(FRUITS[i],W*(0.1+Math.random()*0.8),-L.fr*1.3,(Math.random()-0.5)*80,40+Math.random()*80);f.fi=i;f.gscale=0.32;}

/* ---------- slicing ---------- */
function segCircle(ax,ay,bx,by,cx,cy){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;let t=l?((cx-ax)*dx+(cy-ay)*dy)/l:0;t=Math.max(0,Math.min(1,t));
  const px=ax+dx*t-cx,py=ay+dy*t-cy;return Math.sqrt(px*px+py*py);}
function trySlice(ax,ay,bx,by,pt){
  if(state==='end'||state==='reveal'||state==='pick'||state==='load')return;
  const ang=Math.atan2(by-ay,bx-ax);
  for(const f of fruits){if(!f.alive)continue;if(f.y>H+f.r*0.6)continue;
    if(segCircle(ax,ay,bx,by,f.x,f.y)<f.r*1.15+14)sliceFruit(f,(ax===bx&&ay===by)?(Math.random()-0.5)*0.8:ang,pt);}
}

    if(Math.random()<0.4)setTimeout(()=>Speech.say(Math.random()<0.5?'Silly '+d.k+'!':'Oopsie!',1,1.5,1.05),120);return;}
  f.alive=false;stats.slices++;

  // two halves showing the inside, cut along the swipe angle
  const hi=d.img?IMG[d.img]:IMG['h_'+d.k];const phi=ang-f.rot;const sz=f.r*2*1.08;
  for(let side=0;side<2;side++){
    const c=pieceCanvas();const x=c.getContext('2d');x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,190,190);
    x.save();x.translate(95,95);x.beginPath();x.rect(-95,side?0:-95,190,95);x.clip();x.rotate(-phi);
    if(hi){const iw=hi.naturalWidth,ih=hi.naturalHeight,s=176/Math.max(iw,ih);x.drawImage(hi,-iw*s/2,-ih*s/2,iw*s,ih*s);}
    else{x.fillStyle=d.juice;x.beginPath();x.arc(0,0,80,0,7);x.fill();}
    x.restore();
    // juicy cut edge highlight
    x.save();x.translate(95,95);x.globalCompositeOperation='source-atop';const gg=x.createLinearGradient(0,side?0:0,0,side?24:-24);gg.addColorStop(0,'rgba(255,255,255,0.55)');gg.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=gg;x.fillRect(-95,side?0:-24,190,24);x.restore();
    const nx=-Math.sin(ang)*(side?1:-1),ny=Math.cos(ang)*(side?1:-1);const sp=90+Math.random()*80;
    pieces.push({c,x:f.x+nx*4,y:f.y+ny*4,vx:f.vx*0.5+nx*sp+Math.cos(ang)*60,vy:Math.min(f.vy*0.4,0)+ny*sp-120,rot:ang,vr:(side?1:-1)*(2+Math.random()*3),sz,life:3,g:f.gscale<1?0.5:1});
  }
  juice(f.x,f.y,d.juice,ang,Q?36:22,f.r>60);
  part({x:f.x,y:f.y,type:5,life:0.22,size:f.r*3.2,rot:ang,color:'#ffffff'});
  stains.push({x:f.x+(Math.random()-0.5)*20,y:f.y+(Math.random()-0.5)*20,s:f.r*3.8,rot:Math.random()*6,col:d.juice,v:Math.floor(Math.random()*4),age:0});
  if(stains.length>(Q?16:8))stains.shift();
  Sfx.slice(1,WEAPONS[S.w].k);shake=Math.max(shake,3+f.r*0.04);flash=Math.max(flash,0.08);
  CH.jump=Math.max(CH.jump,0.5);
  // stroke combos

  if(n>=3){stats.combos++;freeze=Math.max(freeze,0.08);shake=Math.max(shake,9);CH.jump=1;CH.spin=n>=5?1:CH.spin;
    let pu=popups.find(p=>p.stroke===st&&p.t<0.9);if(!pu){pu={x:f.x,y:f.y,t:0,n,stroke:st};popups.push(pu);}else{pu.n=n;pu.x=f.x;pu.y=f.y;pu.t=Math.min(pu.t,0.15);}
    Speech.combo(n);sparkles(f.x,f.y,10+n*2,'#fff4a0',300);}
  let gain=1;
  if(d.k==='gold'){gain=5;slowT=0.6;freeze=0.12;shake=14;Sfx.golden();confetti(f.x,f.y,90,['#ffd23f','#fff3a0','#ffffff','#ffb300'],620);CH.spin=1;
    Speech.say(['Golden!','Shiny gold!','Ooh, golden!'][Math.floor(Math.random()*3)],1,1.5,1.0);}
  else if(d.k==='rainbow'){gain=3;slowT=0.5;freeze=0.12;shake=14;Sfx.golden();confetti(f.x,f.y,130,RAINBOW,680);CH.spin=1;startFrenzy(true);}
  else Speech.name(FRUITS[f.fi]||{k:d.k,name:d.k,syl:d.k});
  if(state==='play'||state==='title'){
    if(state==='play'){roundFruit+=gain;S.f+=gain;save();
      if(mode==='free'){freeStarAcc+=gain;while(freeStarAcc>=FREE_STAR_EVERY){freeStarAcc-=FREE_STAR_EVERY;S.s++;S.r++;save();Sfx.ding();
          popups.push({x:W/2,y:H*0.3,t:0,n:0,star:true});checkUnlocks(true);}}
      else{const prev=starsFor(roundFruit-gain),cur=starsFor(roundFruit);if(cur>prev){Sfx.ding();popups.push({x:W/2,y:H*0.25,t:0,n:0,star:true});}}

  }
}
function checkFruitUnlocks(a,b){FRUITS.forEach((fr,i)=>{if(fr.req>a&&fr.req<=b&&!S.a){toast={t:0,img:'f_'+fr.k};Sfx.fanfare();}});}

/* ---------- input ---------- */
function ptPos(e){const r=cv.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}

/* ---------- update ---------- */
function update(dt,rdt){
  clock+=rdt;
  if(lockHold){lockHold.t+=rdt;if(lockHold.t>=2){lockHold=null;unlockAll();}}
  // camera drift (parallax)
  camX*=0.995;camY*=0.995;
  shake*=Math.pow(0.0015,rdt);flash=Math.max(0,flash-rdt);
  for(const k in CH)CH[k]=Math.max(0,CH[k]-rdt*1.6);
  if(toast){toast.t+=rdt;if(toast.t>2.6)toast=null;}
  if(state==='play'){
    gt+=dt;
    if(frenzyT>0){frenzyT-=dt;if(Math.random()<dt*6.5)rainFruit();if(frenzyT<=0)Music.intense=0;}
    if(mode==='round'&&gt>=ROUND_LEN&&!ending){ending=true;Speech.say('Last fruit!',1,1.4,1.0);}
    if(!ending){
      nextSpawn-=dt;
      if(nextSpawn<=0){
        const prog=mode==='round'?gt/ROUND_LEN:Math.min(1,gt/60);
        nextSpawn=1.55-0.6*prog+Math.random()*0.4;if(frenzyT>0)nextSpawn+=0.6;
        let n=1+(Math.random()<0.35+prog*0.2?1:0)+(prog>0.4&&Math.random()<0.25?1:0);
        for(let i=0;i<n;i++){const x=W*(0.15+(n>1?i/(n-1):Math.random())*0.7)+(Math.random()-0.5)*40;
          const r=Math.random();
          if(gt>8&&r<0.035)spawnSpecial('gold',{x});
          else if(gt>15&&gt-lastRainbow>20&&r<0.055){spawnSpecial('rainbow',{x});lastRainbow=gt;}
          else if(gt>9&&r<0.15&&i===n-1)spawnSpecial(Math.random()<0.5?'broccoli':'onion',{x});
          else spawnFruit(true,{x});}
      }
      if(gt>=nextFrenzy){startFrenzy(false);nextFrenzy=gt+(mode==='free'?25:22)+Math.random()*4;}
    }else{endT+=dt;if(endT>1.6||fruits.every(f=>!f.alive||f.y>H+f.r))endRound();}
  }else if(state==='title'){titleSpawn-=dt;if(titleSpawn<=0){titleSpawn=1.6+Math.random()*0.8;const f=toss(FRUITS[pickFruit(false).i]);f.fi=FRUITS.indexOf(f.def);}}
  else if(state==='end'){endT+=rdt;const want=Math.min(endStars,Math.floor((endT-0.6)/0.55)+1);
    if(endT>0.6&&want>starShown){starShown=want;Sfx.chime(4+starShown*2);Sfx.ding();sparkles(W/2+(starShown-2)*L.m*0.2,H*0.2,20,'#ffe76a',300);}
    if(Math.random()<rdt*2.2)firework(W*(0.15+Math.random()*0.7),H*(0.12+Math.random()*0.4));
    if(endT>3.4&&revealQ.length&&!endRevealed){endRevealed=true;showNextReveal('end');}
    if(endT>9)Music.intense=0;}
  else if(state==='reveal'&&reveal){reveal.t+=rdt;if(Math.random()<rdt*3)sparkles(W/2+(Math.random()-0.5)*L.m*0.6,H*0.45+(Math.random()-0.5)*L.m*0.5,4,'#fff6b0',120);}

  // fruits
  const g=H*1.0;
  for(const f of fruits){if(!f.alive)continue;f.age+=dt;f.vy+=g*f.gscale*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.rot+=f.vr*dt;f.vr*=Math.pow(0.6,dt);
    f.vegCd=Math.max(0,f.vegCd-dt);f.wob=Math.max(0,f.wob-dt*1.5);
    if(f.def.veg&&f.wob>0){f.vr*=Math.pow(0.2,dt);}
    if(f.x<f.r*0.6&&f.vx<0)f.vx*=-0.6;if(f.x>W-f.r*0.6&&f.vx>0)f.vx*=-0.6;
    if(f.y>H+f.r*1.6&&f.vy>0)f.alive=false;
    if(f.intro&&Math.random()<dt*10)part({x:f.x+(Math.random()-0.5)*f.r*2,y:f.y+(Math.random()-0.5)*f.r*2,vx:0,vy:-30,g:0,life:0.6,size:8+Math.random()*8,color:'#fff7b0',type:2,rot:0,vr:3,drag:0});

  ctx.save();ctx.translate(W/2,H*0.62);ctx.rotate(clock*0.3);ctx.fillStyle='rgba(255,240,170,0.16)';for(let i=0;i<12;i++){ctx.rotate(Math.PI/6);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(L.m*1.4,-L.m*0.18);ctx.lineTo(L.m*1.4,L.m*0.18);ctx.closePath();ctx.fill();}ctx.restore();
  const sr=L.m*0.085;for(let i=0;i<3;i++){const x=W/2+(i-1)*sr*2.6,y=H*0.17-(i===1?sr*0.4:0);const on=i<starShown;const pop=on?1+0.25*Math.max(0,1-(endT-0.6-i*0.55)*3):1;drawStar(x,y,sr*pop,on,on?Math.sin(clock*3+i)*0.12:0);}
  drawCharacter(W/2,L.port?H*0.68:H*0.86,L.port?H*0.34:H*0.52,'dance');
  const fy=L.port?H*0.27:H*0.17,fx=L.port?W/2:W/2+sr*5.6;drawImgFit(IMG.f_watermelon,fx-L.m*0.06,fy,L.m*0.1,-0.2);bigText(String(roundFruit),fx+L.m*0.02,fy,L.m*0.075,'#fff','left');
  if(endT>2.4){const r=L.btn*1.25;const y=L.port?H*0.88:H*0.78;const a=Math.min(1,(endT-2.4)*3);ctx.globalAlpha=a;
    btn('again',L.port?W*0.3:W*0.2,y,r,'#7dff9a','#18a84a','again',true,true);btn('home',L.port?W*0.7:W*0.8,y,r,'#7fd6ff','#2b7bd6','home');ctx.globalAlpha=1;}
}
function drawReveal(){
  const rv=reveal;const t=rv.t;ctx.fillStyle='rgba(35,10,80,0.78)';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(W/2,H*0.47);ctx.rotate(clock*0.5);for(let i=0;i<16;i++){ctx.rotate(Math.PI/8);ctx.fillStyle=i%2?'rgba(255,230,120,0.22)':'rgba(255,140,220,0.18)';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(L.m*1.5,-L.m*0.16);ctx.lineTo(L.m*1.5,L.m*0.16);ctx.closePath();ctx.fill();}ctx.restore();
  ctx.globalCompositeOperation='lighter';const gs=L.m*(0.9+0.05*Math.sin(clock*4));ctx.drawImage(glowSprite('#ffe9a0'),W/2-gs/2,H*0.47-gs/2,gs,gs);ctx.globalCompositeOperation='source-over';
  const e=t<0.6?(()=>{const x=t/0.6;return 1+Math.pow(2,-10*x)*Math.sin((x-0.075)*2*Math.PI/0.3)*-1;})():1;const sc=Math.max(0.01,t<0.6?(t/0.6)*e:1);
  const u=rv.u;const sz=L.m*0.62*sc;
  if(u.type==='bg'){const im=IMG['bg_'+u.item.k];const w=sz*1.6,h=sz;ctx.save();ctx.translate(W/2,H*0.47);ctx.rotate(Math.sin(clock*2)*0.03);ctx.fillStyle='#fff';rr(-w/2-8,-h/2-8,w+16,h+16,18);ctx.fill();rr(-w/2,-h/2,w,h,12);ctx.clip();if(im)ctx.drawImage(im,-w/2,-h/2,w,h);ctx.restore();}
  else{const name=(u.type==='char'?'c_':'w_')+u.item.k;const rot=u.type==='weapon'?Math.sin(clock*3)*0.25:Math.sin(clock*5)*0.06;const hop=u.type==='char'?-Math.abs(Math.sin(clock*5))*L.m*0.04:0;drawImgFit(IMG[name],W/2,H*0.47+hop,sz,rot);}
  bigText(u.item.name,W/2,H*0.88,Math.min(L.m*0.075,W*0.06),'#ffe14d');
  if(u.type!=='char')drawCharacter(L.port?W*0.18:W*0.12,H*0.98,L.port?H*0.2:H*0.42,'dance');
  if(t>1.2){ctx.globalAlpha=0.6+0.4*Math.sin(clock*5);icon('play',W-L.btn*1.4,H-L.btn*1.4,L.btn*0.9);ctx.globalAlpha=1;}
}
function drawLoad(){ctx.fillStyle='#ffe9b8';ctx.fillRect(0,0,W,H);const r=L.m*0.12;ctx.lineWidth=r*0.25;ctx.strokeStyle='rgba(255,150,60,0.25)';ctx.beginPath();ctx.arc(W/2,H/2,r,0,7);ctx.stroke();
  ctx.strokeStyle='#ff7a2f';ctx.lineCap='round';ctx.beginPath();ctx.arc(W/2,H/2,r,-Math.PI/2,-Math.PI/2+Math.max(0.05,loadP)*Math.PI*2);ctx.stroke();}
function render(){
  buttons=[];
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(state==='load'){drawLoad();return;}
  const sx=(Math.random()-0.5)*shake,sy=(Math.random()-0.5)*shake;
  ctx.save();ctx.translate(sx,sy);
  drawBackground();drawMotes(false);drawStains();
  if(state!=='pick'&&state!=='end'&&!(state==='reveal'&&reveal&&reveal.u.type!=='char'&&false))drawCharacter(L.chX,L.chY,L.chH);
  drawPieces();for(const f of fruits)drawFruit(f);
  drawParticles();drawMotes(true);
  ctx.restore();
  if(vignette)ctx.drawImage(vignette,0,0,W,H);
  if(flash>0){ctx.fillStyle='rgba(255,255,255,'+(flash*2.2)+')';ctx.fillRect(0,0,W,H);}
  if(slowT>0){ctx.fillStyle='rgba(255,230,120,'+(slowT*0.25)+')';ctx.fillRect(0,0,W,H);}
  drawPopups();
  if(state==='play')drawHUD();else if(state==='title')drawTitle();else if(state==='pick')drawPick();else if(state==='end')drawEnd();else if(state==='reveal'&&reveal)drawReveal();
  if(toast){const t=toast.t,a=t<0.3?t/0.3:t>2.2?1-(t-2.2)/0.4:1;const y=H*0.42;ctx.globalAlpha=Math.max(0,a);ctx.globalCompositeOperation='lighter';ctx.drawImage(glowSprite('#fff2a0'),W/2-L.m*0.3,y-L.m*0.3,L.m*0.6,L.m*0.6);ctx.globalCompositeOperation='source-over';
    drawImgFit(IMG[toast.img],W/2,y,L.m*0.3*(0.8+0.2*a),Math.sin(clock*6)*0.15);bigText('NEW!',W/2,y+L.m*0.2,L.m*0.07,'#ffe14d');ctx.globalAlpha=1;}
  drawTrails();
}

/* ---------- main loop ---------- */
let last=0,qCheck=0;const frameLog=[];
function frame(ts){
  requestAnimationFrame(frame);
  const rdt=Math.min(0.05,last?(ts-last)/1000:0.016);const raw=last?ts-last:16;last=ts;
  stats.frames++;stats.sum+=raw;stats.max=Math.max(stats.max,raw);frameLog.push(raw);if(frameLog.length>120)frameLog.shift();
  qCheck+=rdt;if(qCheck>2.5&&state==='play'){qCheck=0;const avg=frameLog.reduce((a,b)=>a+b,0)/frameLog.length;if(avg>24&&Q>0){Q--;resize();}}
  let dt=rdt;if(freeze>0){freeze-=rdt;dt=0;}else if(slowT>0){slowT-=rdt;dt=rdt*0.35;}
  if(state==='reveal')dt=0;
  try{update(dt,rdt);render();}catch(err){stats.errors++;if(stats.errors<4)console.error(err);}
}
function boot(){
  loadSave();resize();
  loadImages(p=>{loadP=p;},()=>{state='title';titleSpawn=0.3;});
  requestAnimationFrame(frame);
  // test/debug hook (harmless in production)
  window.__game={S,stats,get state(){return state;},get mode(){return mode;},fruits:()=>fruits,pieces:()=>pieces,buttons:()=>buttons,
    get gt(){return gt;},set gt(v){gt=v;},get roundFruit(){return roundFruit;},revealQ:()=>revealQ,get reveal(){return reveal;},
    spawnAt(k,x,y,isSpecial){const def=isSpecial?SPECIAL[k]:FRUITS.find(f=>f.k===k);const f=makeFruit(def,x,y,0,0);f.fi=FRUITS.indexOf(def);f.gscale=0;f.age=1;return f;},
    endRound(){if(state==='play'){gt=ROUND_LEN;}},hash:hashString,saveNow,get Q(){return Q;},imgs:()=>Object.keys(IMG).filter(k=>IMG[k]).length,
    imgFromDom:()=>Object.keys(IMG).filter(k=>IMG[k]&&IMG[k].id==='img-'+k).length,frameLog:()=>frameLog.slice()};
}
boot();

</script>
