'use strict';
// ===== core =====
const VW=1200,VH=550,TS=50,COLS=24,ROWS=11;
const cv=document.getElementById('c'),cx=cv.getContext('2d');
let dpr=1,sc=1,ox=0,oy=0,SW=0,SH=0;
function resize(){dpr=Math.min(window.devicePixelRatio||1,2.5);SW=window.innerWidth||VW;SH=window.innerHeight||VH;
  cv.width=Math.round(SW*dpr);cv.height=Math.round(SH*dpr);cv.style.width=SW+'px';cv.style.height=SH+'px';
  sc=Math.min(SW/VW,SH/VH);ox=(SW-VW*sc)/2;oy=(SH-VH*sc)/2;bgKey='';}
window.addEventListener('resize',resize);
// rotation hardening: re-measure on every orientation signal, then poll for ~1.2s so layout snaps as soon as the browser reports new size
(function(){var until=0,raf=0;function chk(){var w=window.innerWidth,h=window.innerHeight;if(w&&h&&(w!==SW||h!==SH))resize();if(performance.now()<until)raf=requestAnimationFrame(chk);else raf=0;}
function kick(){resize();until=performance.now()+1200;if(!raf)raf=requestAnimationFrame(chk);}
window.addEventListener('resize',kick);window.addEventListener('orientationchange',kick);
try{if(screen.orientation&&screen.orientation.addEventListener)screen.orientation.addEventListener('change',kick);}catch(e){}
if(window.visualViewport)window.visualViewport.addEventListener('resize',kick);})();

const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,rnd=(a,b)=>a+Math.random()*(b-a),hyp=Math.hypot;
const sgn=v=>v<0?-1:1,ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
// color override for flashing bosses and locked silhouettes
let FL=false,SIL=false;
const C=c=>SIL?'#0c0c14':FL?'#ffffff':c;
function R(x,y,w,h,c){cx.fillStyle=C(c);cx.fillRect(x,y,w,h);}
function cube(x,y,w,h,c){R(x,y,w,h,c);if(SIL||FL)return;cx.fillStyle='rgba(255,255,255,.2)';cx.fillRect(x,y,w,Math.max(2,h*.16));cx.fillStyle='rgba(0,0,0,.22)';cx.fillRect(x,y+h-Math.max(2,h*.16),w,Math.max(2,h*.16));}
function circ(x,y,r,c){cx.fillStyle=C(c);cx.beginPath();cx.arc(x,y,r,0,7);cx.fill();}
function poly(pts,c,stroke,lw){cx.beginPath();cx.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)cx.lineTo(pts[i],pts[i+1]);cx.closePath();if(c){cx.fillStyle=C(c);cx.fill();}if(stroke&&!SIL){cx.strokeStyle=stroke;cx.lineWidth=lw||2;cx.stroke();}}

// ===== audio =====
let AC=null,master,sfxG,musG,noiseBuf,muted=false;
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume().catch(()=>{});return;}
  try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:.9;master.connect(AC.destination);
    sfxG=AC.createGain();sfxG.gain.value=.75;sfxG.connect(master);musG=AC.createGain();musG.gain.value=.16;musG.connect(master);
    noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    }catch(e){AC=null;}
}
function env(s,dur,vol){const g=AC.createGain();g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(vol,s+.012);g.gain.exponentialRampToValueAtTime(.0001,s+dur);return g;}
function tone(type,f0,f1,dl,dur,vol,dest,at){const s=(at||AC.currentTime)+(dl||0),o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,s);
  if(f1)o.frequency.exponentialRampToValueAtTime(f1,s+dur);const g=env(s,dur,vol);o.connect(g);g.connect(dest||sfxG);o.start(s);o.stop(s+dur+.05);}
function noise(dur,vol,ft,f0,f1,dl,q,dest,at){const s=(at||AC.currentTime)+(dl||0),src=AC.createBufferSource();src.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type=ft;f.Q.value=q||1;
  f.frequency.setValueAtTime(f0,s);if(f1)f.frequency.exponentialRampToValueAtTime(f1,s+dur);const g=env(s,dur,vol);src.connect(f);f.connect(g);g.connect(dest||sfxG);src.start(s,Math.random()*.5);src.stop(s+dur+.05);}
const SFX={
  thwip(){noise(.13,.55,'bandpass',3500,700,0,5);tone('square',1500,280,0,.09,.1);tone('sine',900,2400,0,.06,.12);},
  stick(){noise(.09,.35,'lowpass',1800,300);tone('sine',320,110,0,.09,.25);},
  swoosh(){noise(.32,.55,'bandpass',350,3200,0,2.5);tone('sine',260,1000,0,.26,.08);},
  pow(){tone('sine',190,38,0,.32,.7);noise(.28,.6,'lowpass',3000,180);tone('square',640,180,0,.13,.1);},
  crate(){for(let i=0;i<4;i++)noise(.08,.5,'bandpass',1000-i*170,250,i*.045,2.5);tone('triangle',170,55,0,.2,.35);},
  coin(){tone('square',988,0,0,.08,.1);tone('square',1319,0,.08,.28,.1);},
  hurt(){tone('sawtooth',520,110,0,.35,.22);tone('square',310,90,.05,.3,.1);},
  door(){[523,659,784,1047,1319].forEach((f,i)=>tone('triangle',f,0,i*.08,.3,.25));noise(.6,.12,'highpass',5000,9000,0,1);},
  roar(){const s=AC.currentTime,o=AC.createOscillator(),l=AC.createOscillator(),lg=AC.createGain(),f=AC.createBiquadFilter();o.type='sawtooth';
    o.frequency.setValueAtTime(120,s);o.frequency.exponentialRampToValueAtTime(52,s+1.1);l.frequency.value=17;lg.gain.value=28;l.connect(lg);lg.connect(o.frequency);
    f.type='lowpass';f.frequency.value=900;const g=env(s,1.2,.5);o.connect(f);f.connect(g);g.connect(sfxG);o.start(s);l.start(s);o.stop(s+1.3);l.stop(s+1.3);noise(1.1,.35,'lowpass',800,150);},
  fanfare(){const n=[[523,0,.14],[659,.14,.14],[784,.28,.14],[1047,.42,.3],[784,.74,.12],[1047,.88,.6]];
    n.forEach(([f,d,l])=>{tone('square',f,0,d,l+.05,.13);tone('triangle',f/2,0,d,l+.05,.22);});noise(.4,.2,'highpass',6000,0,.88,1);},
  click(){tone('square',820,380,0,.06,.15);},
  thud(){tone('sine',130,38,0,.35,.7);noise(.22,.45,'lowpass',600,90);},
  sparkle(){for(let i=0;i<7;i++)tone('sine',1400+i*260,0,i*.05,.16,.08);},
  pop(){tone('sine',500,1300,0,.08,.16);},
  shot(){tone('square',640,260,0,.14,.05);tone('sine',300,200,0,.12,.08);},
  swing(){noise(.2,.35,'bandpass',500,2000,0,2);},
  oops(){tone('triangle',520,260,0,.35,.22);tone('triangle',390,180,.18,.4,.22);},
  punch(){tone('sine',260,70,0,.14,.6);noise(.1,.55,'lowpass',2600,300);tone('square',900,300,0,.05,.08);},
  kick(){tone('sine',180,50,0,.18,.65);noise(.14,.55,'bandpass',1400,250,0,2);},
  tap(){tone('triangle',700+Math.random()*120,420,0,.05,.12);noise(.03,.15,'highpass',3000,0,0,1);},
  snap(){noise(.06,.4,'highpass',2000,0,0,1);tone('square',1200,600,0,.05,.08);},
  warn(){tone('triangle',660,990,0,.12,.18);tone('triangle',660,990,.16,.12,.18);},
  poof(){noise(.45,.5,'lowpass',1400,200);tone('sine',420,90,0,.3,.25);},
  cage(){tone('square',240,120,0,.12,.2);noise(.2,.4,'bandpass',2200,800,0,3);tone('triangle',1800,0,.05,.4,.08);},
  zap(){for(let i=0;i<4;i++)tone('square',1800-i*300,400,i*.04,.06,.07);noise(.18,.3,'highpass',4000,0,0,1);},
  boing(){tone('triangle',160,520,0,.12,.4);tone('triangle',520,300,.12,.3,.3);},
  twirl(){for(let i=0;i<6;i++)tone('sine',900+i*180,0,i*.04,.12,.09);noise(.3,.25,'bandpass',800,3000,0,2);},
  whoosh(){noise(.4,.45,'bandpass',300,2400,0,1.8);}
};
function sfx(n){if(!AC||muted)return;try{SFX[n]();}catch(e){}}
// soundtrack director (ToyBand): title theme on menus, sneaky-fun level theme, bigger/faster boss theme,
// fanfare on level complete, little stingers on oops/new suit; ducks under the voice
// AAA in-level music (music/*.mp3, gapless WebAudio loops, intro once): main theme on normal levels, boss theme on
// boss levels, Hob Goblin final theme on the last level. ToyBand keeps menus, story scenes, the party and all stingers.
let MUS=null,musPrev='',AAA=null;
const AAA_TRACKS={main:{url:"music/spidey-attack-aaa.mp3",loopStart:6.0,loopEnd:48.0},boss:{url:"music/spidey-boss-aaa.mp3",loopStart:2.857143,loopEnd:28.571429},final:{url:"music/spidey-final-aaa.mp3",loopStart:3.636372,loopEnd:25.454535}};
function musDuck(s){if(MUS)MUS.duckFor(s);if(AAA)AAA.duckFor(s);}
function musTick(){
  if(!AC)return;
  if(!MUS){try{MUS=ToyBand.create(AC,musG,{songs:SH_SONGS,stingers:SH_STINGS,vol:2});}catch(e){MUS=false;}
    try{if(window.AAAMusic&&window.fetch){AAA=AAAMusic.create(AC,musG,{vol:2.2,tracks:AAA_TRACKS});AAA.preload('main').then(()=>{AAA.preload('boss');AAA.preload('final');});}}catch(e){AAA=null;}}
  if(!MUS)return;MUS.setOn(!muted);
  const st=scr==='play'&&L?'play_'+L.state:scr;
  if(st!==musPrev){if(st==='play_win'){if(AAA)AAA.stop(.5);const d=MUS.sting('fanfare');MUS.play('title',{delay:d*.8,fade:.35});MUS.setI(1);}else if(st==='play_oops')MUS.sting('oops');
    else if(st==='story'&&story&&story.o.boss&&!story.o.beaten)MUS.sting('villain');musPrev=st;}
  if(scr==='play'&&L&&AAA){if(L.state==='win')return;AAA.play(L.boss?(L.i===NL-1?'final':'boss'):'main',{fade:1.2});if(MUS.cur)MUS.stop(1);return;}
  if(AAA&&AAA.want())AAA.stop(1);
  if(scr==='play'&&L){if(L.state==='win')return;const w=L.theme;MUS.play(L.boss?(L.i===NL-1?'final':SH_BOSS_SONG[w]):SH_LEVEL_SONG[w]);MUS.setI(1);}
  else if(scr==='story'&&story){MUS.play(story.o.end?'party':story.o.boss&&!story.o.beaten&&story.o.w===7?'final':'story');MUS.setI(story.o.end?2:0);}
  else{MUS.play('title');MUS.setI(0);}
}
function musSting(n){if(MUS&&!muted)MUS.sting(n);}
setInterval(musTick,60);
document.addEventListener('visibilitychange',()=>{try{if(document.hidden){if(AC)AC.suspend();if(scr==='play'&&L&&L.state==='play')L.state='paused';}else if(AC)AC.resume();}catch(e){}});
// ===== voice =====
let voice=null,lastSay=0;
function pickVoice(){try{const vs=speechSynthesis.getVoices();if(!vs||!vs.length)return;
  for(const p of['Samantha','Google US English','Zira','Jenny','Aria','Karen','Victoria','Female']){const v=vs.find(v=>v.name.indexOf(p)>=0);if(v){voice=v;return;}}
  voice=vs.find(v=>/^en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;}catch(e){}}
try{pickVoice();speechSynthesis.addEventListener('voiceschanged',pickVoice);}catch(e){try{speechSynthesis.onvoiceschanged=pickVoice;}catch(e2){}}
// a second (lower) voice for villains when the device has one; per-character pitch and rate make everyone sound different
let voiceM=null;
function pickVoiceM(){try{const vs=speechSynthesis.getVoices();if(!vs||!vs.length)return;
  for(const p of['Daniel','Fred','Alex','Google UK English Male','Guy','David','Mark','Male']){const v=vs.find(v=>v.name.indexOf(p)>=0&&/^en/i.test(v.lang));if(v){voiceM=v;return;}}}catch(e){}}
try{pickVoiceM();speechSynthesis.addEventListener('voiceschanged',pickVoiceM);}catch(e){}
const VOX={narr:{p:1.4,r:1.05},hero:{p:1.2,r:1.1},ghost:{p:1.6,r:1.12},night:{p:1.05,r:1.15,m:1},ninja:{p:.85,r:1,m:1},skull:{p:.7,r:.95,m:1},
  lizard:{p:.55,r:.85,m:1},goblin:{p:1.9,r:1.25,m:1},doc:{p:.8,r:.9,m:1},stinger:{p:1.35,r:1.3,m:1},vulture:{p:.5,r:.8,m:1},rhino:{p:.3,r:.8,m:1},
  bigboss:{p:.1,r:.75,m:1},hob:{p:1.7,r:1.15,m:1},all:{p:1.1,r:1}};
function sayAs(t,who,onend){if(muted)return false;const v=VOX[who]||VOX.narr;lastSay=performance.now();
  musDuck(.6+t.length*.075/v.r);
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t),vv=v.m&&voiceM?voiceM:voice;if(vv){u.voice=vv;u.lang=vv.lang;}else u.lang='en-US';
    u.pitch=v.p;u.rate=v.r;u.volume=1;if(onend){u.onend=onend;u.onerror=onend;}speechSynthesis.speak(u);return true;}catch(e){return false;}}
function say(t,force){if(muted)return;const n=performance.now();if(!force&&n-lastSay<1500)return;lastSay=n;
  musDuck(.5+t.length*.07);try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);if(voice){u.voice=voice;u.lang=voice.lang;}else u.lang='en-US';u.pitch=1.4;u.rate=1.05;u.volume=1;speechSynthesis.speak(u);}catch(e){}}
// ===== learning words (narrator + small numerals only; never changes aiming, hits, enemies or stars) =====
// a waiting line plays only once the last line has had time to finish, so nothing piles up or gets cut off
const EDU_N=['zero','one','two','three','four','five','six','seven','eight','nine','ten'];
const eduCap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const eduCount=n=>eduCap(EDU_N.slice(1,n+1).join(', '))+'!';
const EDU_SUIT=['Red and blue!','Black and white!','Red and black!','Red and black!','All black!','White, pink and blue!','Black and red!','All red!','Black and white!'];
let eduP=null,eduNums=[],eduLeft=null,eduLastCombo=-1e9,eduLastCrawl=-1e9,eduLastBox=-1e9,eduL=null,eduPrevN=-1,eduStarL=null;
function eduSay(part,text,within){const n=performance.now();if(!eduP||n>eduP.until)eduP={until:0,count:'',left:'',misc:''};
  eduP[part]=text;eduP.until=n+(within||3000);}
function eduTick(){
  if(L&&scr==='play'){
    if(eduL!==L){eduL=L;eduPrevN=-1;eduLeft=null;eduNums=[];}
    const n=L.enemies.filter(e=>e.state==='live'||e.state==='held').length;
    if(eduPrevN>=0&&n<eduPrevN&&L.state==='play'){eduLeft={n,t:performance.now()};
      eduSay('left',n===0?'No more bad guys!':n===1?'One bad guy left!':eduCap(EDU_N[n]||String(n))+' bad guys left!');}
    eduPrevN=n;
    if(L.state==='win'&&eduStarL!==L&&L.stT>=1+(L.stars-1)*.35+.15){eduStarL=L;eduSay('misc',L.stars===1?'One star!':eduCount(L.stars)+' '+eduCap(EDU_N[L.stars])+' stars!',4000);}
  }
  if(eduP){const n=performance.now();if(n>eduP.until)eduP=null;
    else if(n-lastSay>1300){const t=[eduP.count,eduP.left,eduP.misc].filter(Boolean).slice(0,2).join(' ');eduP=null;if(t)say(t,true);}}
}
setInterval(eduTick,100);
function eduComboHit(k,x,y){eduNums.push({n:k+1,x,y,t:performance.now()});if(eduNums.length>9)eduNums.shift();}
function eduComboEnd(){const n=performance.now();if(n-eduLastCombo<6000)return;eduLastCombo=n;eduSay('count','One, two, three! Three hits!');}
function eduCrawl(dir,pop){const n=performance.now();if(pop||n-eduLastCrawl<3500)return;eduLastCrawl=n;if(n-lastSay>1300)say(dir<0?'Up!':'Down!');}
function eduBox(){const n=performance.now();if(n-eduLastBox<5000)return;eduLastBox=n;eduSay('misc','Brown box!',2000);}
function eduDraw(){const n=performance.now();
  for(const e of eduNums){const a=(n-e.t)/700;if(a>=1)continue;const s=Math.min(1,a*7);cx.save();cx.globalAlpha=1-a*a;cx.translate(e.x+(e.n-2)*34,e.y-62-a*30);cx.scale(s,s);
    cx.font='900 34px system-ui,sans-serif';cx.textAlign='center';cx.textBaseline='middle';cx.lineWidth=7;cx.strokeStyle='#1e4fc2';cx.strokeText(e.n,0,0);cx.fillStyle='#fff';cx.fillText(e.n,0,0);cx.restore();}}
function eduDrawHud(){if(!eduLeft||L.boss)return;const a=(performance.now()-eduLeft.t)/1400;if(a>=1)return;const s=Math.min(1,a*6)*(1+.15*Math.sin(a*12));
  cx.save();cx.globalAlpha=a<.7?1:1-(a-.7)/.3;cx.translate(VW/2,92);cx.scale(s,s);circ(0,0,30,'#6b3fa0');cx.fillStyle='#fff';cx.font='900 38px system-ui,sans-serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(eduLeft.n,0,2);cx.restore();}
function toggleMute(){muted=!muted;try{if(master)master.gain.setTargetAtTime(muted?0:.9,AC.currentTime,.02);if(muted)speechSynthesis.cancel();}catch(e){}if(!muted)sfx('click');}
// ===== progress (location.hash) =====
// v2: #p=level,heroMask,hero,stars(24 digits),2   old links (#p=level,suitsMask,suit,stars(12)) still load and are converted
const SUITS=['Red and Blue','Black Web','Hoodie Hero','Red Merc','Dark Goo','Ghost Web','Night Spider','Red Ninja','Skull Guard'];
const NCH=SUITS.length,ALLMASK=(1<<NCH)-1;
// what each level unlocks (level index -> costume / hero): something new every few levels, heroes after bosses
const UNLOCKS={1:1,2:5,4:2,8:6,10:3,14:7,16:4,20:8};
const prog={lvl:1,mask:1,suit:0,stars:new Array(24).fill(0)};
function loadProg(){try{const m=/p=([\d,]+)/.exec(location.hash||'');if(!m)return;const a=m[1].split(',');
  if(a[4]==='2'){prog.lvl=clamp(parseInt(a[0])||1,1,24);prog.mask=(clamp(parseInt(a[1])||1,1,ALLMASK))|1;prog.suit=clamp(parseInt(a[2])||0,0,NCH-1);
    const st=a[3]||'';for(let i=0;i<24;i++)prog.stars[i]=clamp(parseInt(st[i])||0,0,3);}
  else{const ol=clamp(parseInt(a[0])||1,1,12),st=a[3]||'';let top=0;prog.mask=(clamp(parseInt(a[1])||1,1,31))|1;prog.suit=clamp(parseInt(a[2])||0,0,4);
    for(let j=0;j<12;j++){const s2=clamp(parseInt(st[j])||0,0,3),n=OLD2NEW[j];prog.stars[n]=s2;if(s2>0||j<ol-1){top=Math.max(top,n+2);if(UNLOCKS[n])prog.mask|=1<<UNLOCKS[n];}}
    prog.lvl=clamp(Math.max(top,OLD2NEW[ol-1]+1),1,24);saveProg();}
  if(!(prog.mask>>prog.suit&1))prog.suit=0;}catch(e){}}
function saveProg(){const h='#p='+[prog.lvl,prog.mask,prog.suit,prog.stars.join(''),2].join(',');
  try{history.replaceState(null,'',h);}catch(e){try{location.hash=h;}catch(e2){}}}
// ===== ToyBand music engine + Spider Hero songs (shared engine, original themes) =====
/* ToyBand v1: a tiny preschool-TV style music engine for Alex's games.
   Everything is synthesized once at start into small sample buffers (glockenspiel, ukulele, recorder, kazoo,
   brass, tuba, pizzicato, koto, flute, calliope, organ, drums, tambourine, woodblock...), then songs are
   played with a lookahead scheduler: one buffer source + one gain per note, shared per-instrument buses,
   a generated-impulse reverb, light stereo pan and a compressor. All melodies are original.
   API: var M = ToyBand.create(audioCtx, destNode, {songs, stingers, fx, vol, auto});
        M.play(name,{fade,delay}) M.setI(0..2) M.boost() M.unboost() M.sting(name) M.duck(on) M.duckFor(s) M.setOn(b) */
var ToyBand = (function () {
  "use strict";
  var NN = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  var CQ = { "": [0, 4, 7], m: [0, 3, 7], "7": [0, 4, 7, 10], m7: [0, 3, 7, 10], maj7: [0, 4, 7, 11], dim: [0, 3, 6], sus: [0, 5, 7], "6": [0, 4, 7, 9], aug: [0, 4, 8] };
  var TR = 22050, DR = 32000, LOOK = 0.2, CAP = 48;

function whoVoice(w,o){return w==='villain'?o.boss:w==='hero'?(heroOf(prog.suit)==='spidey'?'hero':heroOf(prog.suit)):w;}
function playStory(lines,o,then){story={lines,o:o||{},then,i:-1,lt:0};go('story');nextLine();}
function nextLine(){const S=story;if(!S)return;S.i++;S.lt=0;S.done=false;if(S.i>=S.lines.length){endStory();return;}
  const ln=S.lines[S.i],me=S;S.spoke=sayAs(ln[1],whoVoice(ln[0],S.o),()=>{if(story===me&&!me.done){me.done=true;me.doneAt=me.lt;}});
  if(ln[0]==='villain'&&S.i>0&&S.lines[S.i-1][0]!=='villain')sfx('boing');}
function endStory(){const f=story&&story.then;story=null;try{speechSynthesis.cancel();}catch(e){}if(f)f();}

function storyTick(dt){const S=story;if(!S)return;S.lt+=dt;const ln=S.lines[S.i];if(!ln)return;

  // hints: L1-2 finger swipes from the hero toward the goon; tower levels show a swipe-up when clinging
  if(L.state==='play'&&!aim&&!busy()){const k=(t%1.6)/1.2,d=Math.min(1,k)*100;
    const tgt=L.i<2&&L.shots===0?L.enemies.find(e=>e.state==='live'):null;
    if(tgt){const a=Math.atan2(tgt.y-30-P.y,tgt.x-P.x);handIcon(P.x+Math.cos(a)*(30+d),P.y+Math.sin(a)*(30+d)+8,k<1);}
    else if(P.nx&&L.climb){const cp=crawlPlan(P.x,P.y,P.nx,-1);if(cp&&(cp.pop||cp.moved>=8))handIcon(P.x+P.nx*48,P.y+40-d*.9,k<1);}}
  eduDraw();
  cx.restore();
  // HUD
  btn('home',45,40,28,'#1e4fc2','home',()=>{sfx('click');go('map');});
  btn('pause',110,40,28,'#1e4fc2','pause',()=>{if(L.state==='play'){L.state='paused';sfx('click');}});
  btn('mute',VW-45,40,28,'#1e4fc2',muted?'mute':'sound',toggleMute);
  for(let k=0;k<3;k++)heart(175+k*44,40,1.5,k<L.hearts);
  const lc=L.i+1;circ(VW-110,40,24,'rgba(0,0,0,.35)');cx.fillStyle='#fff';cx.font='900 26px system-ui,sans-serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(lc,VW-110,42);
  const boss=L.enemies.find(e=>isBoss(e)&&e.state!=='beaten'),BB=boss&&BOSS[boss.type];
  if(boss){const mh=boss.mhp,w=380,x0=VW/2-w/2;R(x0-6,22,w+12,36,'#111');for(let k=0;k<mh;k++){const sw=w/mh;R(x0+k*sw+3,28,sw-6,24,k<boss.hp?(boss.hp<=mh/3?'#ff3b3b':'#3ddc5a'):'#333');R(x0+k*sw+3,28,sw-6,6,'rgba(255,255,255,.25)');}
    circ(x0-22,40,22,BB.col);R(x0-28,33,12,6,BB.eye);}
  eduDrawHud();
  if(L.stT<1.3&&L.state==='play'){const a=clamp(1.3-L.stT,0,1);cx.globalAlpha=a;circ(VW/2,VH/2,70,'#e8182c');cx.fillStyle='#fff';cx.font='900 80px system-ui,sans-serif';cx.fillText(lc,VW/2,VH/2+4);cx.globalAlpha=1;}
  if(L.state==='paused'){cx.fillStyle='rgba(0,0,20,.6)';cx.fillRect(0,0,VW,VH);
    btn('pmap',VW/2-200,VH/2,55,'#1e4fc2','map',()=>{sfx('click');go('map');});btn('pretry',VW/2+200,VH/2,55,'#ffb000','retry',()=>{sfx('click');startLevel(L.i);});
    btn('presume',VW/2,VH/2,85,'#3ddc5a','play',()=>{sfx('click');L.state='play';});}
  if(L.state==='oops'){cx.fillStyle='rgba(40,0,20,'+Math.min(.55,L.stT)+')';cx.fillRect(0,0,VW,VH);cx.save();cx.translate(VW/2,VH/2);cx.rotate(-L.stT*5);drawIcon('retry',0,0,2.6,'#fff');cx.restore();
    drawHero(prog.suit,VW/2,VH/2+10,Math.sin(L.stT*10)*.2,2,{t,dizzy:true});}
  if(L.state==='win'&&L.stT>.7){const k=Math.min(1,(L.stT-.7)*3);cx.fillStyle='rgba(0,0,30,'+.5*k+')';cx.fillRect(0,0,VW,VH);
    cx.save();cx.translate(VW/2,VH/2-10);cx.scale(k,k);R(-300,-170,600,330,'#ffffff');R(-292,-162,584,314,'#1e4fc2');
    for(let s=0;s<3;s++){const st=L.stT-1-s*.35;if(st>0&&!L['ss'+s]){L['ss'+s]=1;if(s<L.stars)sfx('coin');}
      const sz=st>0?Math.min(1.25,st*5)-(st>.2?Math.min(.25,(st-.2)):0):0;cx.save();cx.translate(-130+s*130,-75-(s===1?18:0));cx.scale(sz,sz);star(0,0,52,s<L.stars?'#ffd23f':'#0e2a6e','#fff');cx.restore();}
    cx.restore();
    if(L.stT>1.6){const last=L.i>=NL-1;
      btn('wmap',VW/2-170,VH/2+75,45,'#7a2fd0','map',()=>{sfx('click');afterWin(()=>go('map'));});
      btn('wretry',VW/2,VH/2+75,45,'#ffb000','retry',()=>{sfx('click');afterWin(()=>startLevel(L.i));});
      btn('wnext',VW/2+170,VH/2+75,55*(1+Math.sin(t*5)*.06),'#3ddc5a',last?'map':'next',()=>{sfx('click');const n=L.i+1;afterWin(()=>last?go('map'):enterLevel(n));});}}}
// after a boss win: the boss's "sorry" scene (and the ending party after the last boss), then any new hero/suit reveal
function afterWin(then){if(!L)return then();const i=L.i,ns=L.newSuit;L.newSuit=-1;
  const rev=()=>{if(ns>0){prog.suit=ns;saveProg();reveal={suit:ns,then};go('reveal');}else then();};
  if(isBossLvl(i)&&!L.postSeen){L.postSeen=1;const w=Math.floor(i/3),b=WORLDS[w].boss;
    playStory(STORY.post[b],{w,boss:b,beaten:1},i===NL-1?()=>playStory(STORY.end,{w:7,end:1},rev):rev);}
  else rev();}
function handIcon(x,y,down){cx.save();cx.translate(x,y);cx.globalAlpha=.9;circ(0,0,down?14:16,'#ffe0c2');R(-5,-34,10,30,'#ffe0c2');cx.strokeStyle='#7a4f2a';cx.lineWidth=2;cx.beginPath();cx.arc(0,0,down?14:16,0,7);cx.stroke();cx.strokeRect(-5,-34,10,30);cx.restore();cx.globalAlpha=1;}
const SWIPEMIN=15; // screen px
// ===== input =====
let aim=null,pid=null,firstDone=false;
function vpt(e){return{x:(e.clientX-ox)/sc,y:(e.clientY-oy)/sc};}
function firstTap(){initAudio();if(firstDone)return;firstDone=true;if(scr==='title')setTimeout(()=>say('Spidey Attack!',true),150);
  try{const de=document.documentElement,rq=de.requestFullscreen||de.webkitRequestFullscreen;if(rq&&document.fullscreenEnabled!==false&&!document.fullscreenElement){const p=rq.call(de,{navigationUI:'hide'});
    const lk=()=>{try{const q=screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape');if(q&&q.catch)q.catch(()=>{});}catch(e){}};
    if(p&&p.then)p.then(lk).catch(()=>{});else lk();}}catch(e){}}
const portrait=()=>SH>SW*1.05&&!rotDismissed;
cv.addEventListener('pointerdown',e=>{e.preventDefault();firstTap();if(pid!==null&&pid!==e.pointerId)return;pid=e.pointerId;try{cv.setPointerCapture(pid);}catch(_){}
  const p=vpt(e);if(portrait()){rotDismissed=true;pid=null;return;}
  for(let k=BTN.length-1;k>=0;k--){const b=BTN[k];if(hyp(p.x-b.x,p.y-b.y)<b.r+8){pressed=b;holdT=performance.now();return;}}
  if(scr==='play'&&L&&L.state==='play'){aim={sx:p.x,sy:p.y,x:p.x,y:p.y,c0x:e.clientX,c0y:e.clientY,moved:false};}
  else if(scr==='title'){sfx('click');go('map');}
  else if(scr==='story')storyTap();});
cv.addEventListener('pointermove',e=>{if(e.pointerId!==pid)return;e.preventDefault();const p=vpt(e);if(aim){aim.x=p.x;aim.y=p.y;if(hyp(e.clientX-aim.c0x,e.clientY-aim.c0y)>=SWIPEMIN*.7)aim.moved=true;}});
function up(e){if(e.pointerId!==pid)return;pid=null;const p=vpt(e);
  if(pressed){const b=pressed;pressed=null;if(!b.hold&&hyp(p.x-b.x,p.y-b.y)<b.r+20)b.cb();return;}
  if(aim&&scr==='play'&&L&&L.state==='play'&&!busy())swipeAct(aim,p,hyp(e.clientX-aim.c0x,e.clientY-aim.c0y));
  aim=null;}
// swipe = shoot from the hero in the drag direction; tap = shoot toward the tap point; on a wall, up/down swipe = crawl
function swipeAct(a,p,scrLen){const P=L.player;let dx,dy,tap=scrLen<SWIPEMIN;
  if(tap){dx=p.x-P.x;dy=p.y-P.y;}else{dx=p.x-a.sx;dy=p.y-a.sy;}
  const ln=hyp(dx,dy);if(ln<6)return;dx/=ln;dy/=ln;
  if(!tap&&P.nx&&Math.abs(dy)>.86){const near=assist(dx,dy,.26);if(!near){if(crawl(dy<0?-1:1))return;}}
  const as=assist(dx,dy);if(as){dx=as.dx;dy=as.dy;}shoot(dx,dy);}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',e=>{if(e.pointerId===pid){pid=null;aim=null;pressed=null;}});
for(const ev of['touchstart','touchmove','touchend','gesturestart','gesturechange','dblclick','contextmenu','wheel'])document.addEventListener(ev,e=>{if(e.cancelable)e.preventDefault();},{passive:false});
window.addEventListener('hashchange',()=>{});
// ===== main loop =====
function drawRotate(){cx.setTransform(dpr,0,0,dpr,0,0);cx.fillStyle='#0b1630';cx.fillRect(0,0,SW,SH);const s=Math.min(SW,SH)/400,t=performance.now()/1000;
  cx.save();cx.translate(SW/2,SH/2);cx.scale(s,s);const a=-Math.min(1,(t%2.4)/1.2)*Math.PI/2;cx.rotate(a);R(-60,-110,120,220,'#fff');R(-50,-95,100,180,'#1e4fc2');cx.save();cx.translate(0,0);cx.rotate(-a);drawHero(prog.suit,0,10,0,1.6,{t});cx.restore();circ(0,100,6,'#1e4fc2');cx.restore();
  cx.save();cx.translate(SW/2+110*s,SH/2-130*s);cx.scale(s,s);cx.strokeStyle='#ffd23f';cx.lineWidth=8;cx.lineCap='round';cx.beginPath();cx.arc(0,0,40,-2.5,0);cx.stroke();
  cx.fillStyle='#ffd23f';cx.beginPath();cx.moveTo(52,-6);cx.lineTo(28,-6);cx.lineTo(40,14);cx.fill();cx.restore();}
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;scrT+=dt;if(unlockFx>0)unlockFx-=dt;
  try{
    if(pressed&&pressed.hold&&performance.now()-holdT>2000){pressed=null;prog.lvl=NL;prog.mask=ALLMASK;saveProg();sfx('sparkle');unlockFx=1;}
    if(scr==='play')update(dt);else if(scr==='story')storyTick(dt);
    cx.setTransform(dpr,0,0,dpr,0,0);cx.fillStyle='#05070f';cx.fillRect(0,0,SW,SH);
    if(portrait()){BTN=[];drawRotate();}
    else{cx.setTransform(dpr*sc,0,0,dpr*sc,dpr*ox,dpr*oy);cx.save();cx.beginPath();cx.rect(0,0,VW,VH);cx.clip();BTN=[];
      if(scr==='title')drawTitle();else if(scr==='map')drawMap();else if(scr==='suits')drawSuits();else if(scr==='reveal'&&reveal)drawReveal();else if(scr==='story'&&story)drawStory();else if(scr==='play'&&L)drawPlay();else go('map');
      cx.restore();}
  }catch(err){console.error(err);}
  requestAnimationFrame(frame);}
loadProg();resize();requestAnimationFrame(frame);
</script>
