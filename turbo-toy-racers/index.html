function drawRaceCar(c){const w=carW(c)*(c.isP||c.id==='boss'?1:1-.045*c.lane),lane=c.isP||c.id==='boss'?0:-c.lane*5;const nx=Math.sin(c.ang),ny=-Math.cos(c.ang);const bob=c.mode==='track'&&c.v>50?Math.sin(R.t*24+c.lane)*1.5:0;
  const fl=c.flip?TAU*easeOut(clamp(c.flipT/c.flipD,0,1)):0;
  cx.save();if(!c.isP)cx.globalAlpha=1;
  const x=c.x+nx*lane*-1,y=c.y+ny*lane*-1;
  if(c.boostT>0){cx.save();cx.translate(x,y);cx.rotate(c.ang+fl);const L=w*.55+Math.random()*30;const g=cx.createLinearGradient(-w/2,0,-w/2-L,0);g.addColorStop(0,'rgba(255,255,220,.95)');g.addColorStop(.3,'rgba(255,170,40,.9)');g.addColorStop(1,'rgba(255,60,20,0)');cx.fillStyle=g;cx.beginPath();cx.moveTo(-w*.45,-w*.12);cx.lineTo(-w/2-L,-w*.2);cx.lineTo(-w*.45,-w*.32);cx.fill();cx.restore();}

  else drawCar(c.id,x,y,c.ang,w,{bob,noShadow:c.mode!=='track'});

function drawGate(p,fin){cx.save();cx.translate(p.x,p.y);const h=240;
  cx.fillStyle='#e8e8f0';cx.fillRect(-8,-h,12,h+THK);

function drawFx(f){const a=clamp(f.l/f.m,0,1);
  if(f.k==='spark'){cx.strokeStyle='rgba(255,'+(200+Math.random()*55|0)+',80,'+a+')';cx.lineWidth=3;cx.beginPath();cx.moveTo(f.x,f.y);cx.lineTo(f.x-f.vx*.03,f.y-f.vy*.03);cx.stroke();}
  else if(f.k==='smoke'){cx.fillStyle=f.c+(a*.55)+')';cx.beginPath();cx.arc(f.x,f.y,f.s,0,TAU);cx.fill();}
  else if(f.k==='flame'){const g=cx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.s);g.addColorStop(0,'rgba(255,255,200,'+a+')');g.addColorStop(.5,'rgba(255,150,30,'+a*.8+')');g.addColorStop(1,'rgba(255,50,0,0)');cx.fillStyle=g;cx.beginPath();cx.arc(f.x,f.y,f.s,0,TAU);cx.fill();}
  else if(f.k==='star'){cx.globalAlpha=a;star5(f.x,f.y,f.s,'#ffd23f','#fff');cx.globalAlpha=1;}
  else if(f.k==='glint'){cx.globalAlpha=a;star5(f.x,f.y,f.s*(.5+a),'#fff8c0');cx.globalAlpha=1;}
  else if(f.k==='ring'){cx.strokeStyle='rgba(255,240,150,'+a+')';cx.lineWidth=4;cx.beginPath();cx.arc(f.x,f.y,f.s*(1.6-a),0,TAU);cx.stroke();}
  else if(f.k==='conf'){cx.save();cx.translate(f.x,f.y);cx.rotate(f.rot);cx.globalAlpha=Math.min(1,a*2);cx.fillStyle=f.c;cx.fillRect(-f.s/2,-f.s/4,f.s,f.s/2);cx.restore();}
  else if(f.k==='debris'){cx.save();cx.translate(f.x,f.y);cx.rotate(f.rot);cx.globalAlpha=Math.min(1,a*2);cx.fillStyle=f.c;cx.fillRect(-f.s,-f.s/3,f.s*2,f.s*.66);cx.restore();}}

function menuBG(c1,c2){const g=cx.createLinearGradient(0,0,0,VH);g.addColorStop(0,c1);g.addColorStop(1,c2);cx.fillStyle=g;cx.fillRect(0,0,VW,VH);

function drawMap(){menuBG('#1b2a7a','#0b1240');const n=3,gap=22,cw=Math.min(330,(VW-90-gap*2)/3),ch=290,x0=VW/2-(cw*3+gap*2)/2,y0=88;

    rr(0,6,cw,ch,26);cx.fillStyle='rgba(0,0,0,.35)';cx.fill();rr(0,0,cw,ch,26);cx.save();cx.clip();const im=IMG[W.bg];
    if(okI(im)){const s=ch/im.naturalHeight;cx.drawImage(im,-(im.naturalWidth*s-cw)/2,0,im.naturalWidth*s,ch);}else{cx.fillStyle=W.col;cx.fillRect(0,0,cw,ch);}
    const g=cx.createLinearGradient(0,0,0,ch);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,30,.55)');cx.fillStyle=g;cx.fillRect(0,0,cw,ch);

    drawIcon('lock',x+30,ty+35,.8,'#ccc');txt(S0.name,x+tw/2+16,ty+35,Math.min(20,tw/10),'#ccd');BTN.push({id:'soon'+k,x:x+tw/2,y:ty+35,r:40,cb:()=>{sfx('click');say(['Coming soon!']);}});}

  if(f>0){cx.strokeStyle='#ffd23f';cx.lineWidth=5;cx.beginPath();cx.arc(VW-26,VH-24,24,-PI/2,-PI/2+f*TAU);cx.stroke();}}
function drawGarage(){menuBG('#5a1a8a','#160a3a');txt('PICK YOUR CAR!',VW/2,46,42,'#ffd23f');

    if(own){const b=sel?Math.sin(scrT*8)*4:0;drawCar(c.id,0,chh*.28+b,0,cw*.78,{});txt(c.name,0,-chh/2+20,Math.min(20,cw/10),'#fff');}
    else{cx.filter='brightness(0)';cx.globalAlpha=.55;drawCar(c.id,0,chh*.28,0,cw*.78,{noShadow:1});cx.filter='none';cx.globalAlpha=1;drawIcon('lock',0,-6,1,'#ddd');star5(-14,chh/2-22,12,'#ffd23f');txt(String(c.star),14,chh/2-22,22,'#fff');}
    cx.restore();

function drawResults(){const w=T.w;drawBG(w,R.camX,R.camY,1);cx.fillStyle='rgba(10,10,40,.45)';cx.fillRect(0,0,VW,VH);const t=R.resT;
  cx.save();cx.translate(VW/2,VH*.5);cx.rotate(t*.4);for(let k=0;k<14;k++){cx.rotate(TAU/14);cx.fillStyle=k%2?'rgba(255,210,63,.16)':'rgba(255,255,255,.07)';cx.beginPath();cx.moveTo(0,0);cx.lineTo(900,-120);cx.lineTo(900,120);cx.fill();}cx.restore();
  const pl=P.place,pc=pl===1?'#ffcc22':pl===2?'#d6dfec':pl===3?'#e0904a':'#8fd0ff';

  txt(pl+(['','st','nd','rd','th'][pl]||'th'),VW/2-210,VH*.42+90,58,pc);
  const cb=Math.abs(Math.sin(t*4))*16;drawCar(P.id,VW/2+150,VH*.62-cb,Math.sin(t*4)*.05,300,{squash:cb<2?.5:0});
  txt(R.boss&&pl===1?'CRUSHER BEATEN!':pl===1?'WINNER!':'GREAT RACE!',VW/2+150,70,54,'#fff');
  for(let k=0;k<3;k++){const ap=clamp((t-.6-k*.35)*3,0,1),got=k<R.stars;cx.save();cx.translate(VW/2+70+k*80,150);cx.scale(easeBack(ap),easeBack(ap));star5(0,0,32,got?'#ffd23f':'rgba(0,0,0,.4)','#fff');cx.restore();
    if(got&&!R['st'+k]&&ap>.5){R['st'+k]=1;sfx('star');if(k===R.stars-1)setTimeout(()=>{if(scr==='results')say(['Super star!']);},300);}}
  coinIcon(VW/2+60,VH-170,18);txt('+'+R.coins,VW/2+110,VH-168,30,'#ffe680');
  if(t>1.4){const nx=R.r+1<NR&&raceOpen(R.r+1);
    btn('rmap',VW/2-250,VH-70,44,'#2f6bff','map',()=>{sfx('click');R=null;go('map');});
    btn('rretry',VW/2-150,VH-70,44,'#ff9a2e','retry',()=>{sfx('click');startRace(R.r,prog.car);});
    if(nx){const s2=1+Math.sin(t*6)*.06;cx.save();cx.translate(VW-120,VH-86);cx.scale(s2,s2);btn('rnext',0,0,62,'#22c84a','next',()=>{sfx('click');startRace(R.r+1,prog.car);});cx.restore();const b=BTN[BTN.length-1];b.x=VW-120;b.y=VH-86;}}
  if(Math.random()<.12)confetti(rnd(0,VW),-20,3,.4);

  if(reveal)drawReveal();}
function drawReveal(){const r=reveal,t=r.t;cx.fillStyle='rgba(10,5,40,.85)';cx.fillRect(0,0,VW,VH);cx.save();cx.translate(VW/2,VH/2);cx.rotate(t*.6);for(let k=0;k<12;k++){cx.rotate(TAU/12);cx.fillStyle=k%2?'rgba(255,210,63,.25)':'rgba(255,255,255,.08)';cx.beginPath();cx.moveTo(0,0);cx.lineTo(800,-110);cx.lineTo(800,110);cx.fill();}cx.restore();

  for(let k=0;k<8;k++){const a=t*2+k*.785;star5(VW/2+Math.cos(a)*260,VH*.55+Math.sin(a)*120,10+Math.sin(t*8+k)*4,'#ffd23f');}
  BTN=[{id:'rev',x:VW/2,y:VH/2,r:2000,cb:()=>{if(r.t>1){reveal=null;}}}];}
// ===== input =====
let firstDone=false,rotDismissed=false;
function vpt(e){return{x:(e.clientX-ox)/sc,y:(e.clientY-oy)/sc};}
function firstTap(){initAudio();voicePreload();if(firstDone)return;firstDone=true;if(scr==='title')setTimeout(()=>say(['Turbo Toy Racers!'],true),200);
  try{const de=document.documentElement,rq=de.requestFullscreen||de.webkitRequestFullscreen;if(rq&&document.fullscreenEnabled!==false&&!document.fullscreenElement){const p=rq.call(de,{navigationUI:'hide'});
    const lk=()=>{try{const q=screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape');if(q&&q.catch)q.catch(()=>{});}catch(e){}};
    if(p&&p.then)p.then(lk).catch(()=>{});else lk();}}catch(e){}}
const portrait=()=>SH>SW*1.05&&!rotDismissed;
function raceControl(p){hudLayout();const h=HUDC;if(hyp(p.x-h.pause.x,p.y-h.pause.y)<h.pause.r+16)return'pause';
  if(hyp(p.x-h.boost.x,p.y-h.boost.y)<h.boost.r+28)return'boost';if(hyp(p.x-h.brake.x,p.y-h.brake.y)<h.brake.r+46)return'brake';return'go';}
cv.addEventListener('pointerdown',e=>{e.preventDefault();firstTap();try{cv.setPointerCapture(e.pointerId);}catch(_){}const p=vpt(e);
  if(portrait()){rotDismissed=true;return;}
  if(scr==='race'&&R&&!paused&&(R.state==='run'||R.state==='count'||R.state==='intro')){const role=raceControl(p);
    if(role==='pause'){paused=true;if(M)M.hold(true);sfx('click');return;}ptr.set(e.pointerId,role);if(role==='boost')doBoost();return;}
  for(let k=BTN.length-1;k>=0;k--){const b=BTN[k];if(hyp(p.x-b.x,p.y-b.y)<b.r+10){ptr.set(e.pointerId,{b,t0:performance.now(),done:false});return;}}
  if(scr==='title'){sfx('click');go('map');}});
function pup(e){const v=ptr.get(e.pointerId);ptr.delete(e.pointerId);if(!v||typeof v==='string')return;const p=vpt(e);if(!v.b.hold&&hyp(p.x-v.b.x,p.y-v.b.y)<v.b.r+24)v.b.cb();}
cv.addEventListener('pointerup',pup);cv.addEventListener('pointercancel',e=>ptr.delete(e.pointerId));
for(const ev of['touchstart','touchmove','touchend','gesturestart','gesturechange','dblclick','contextmenu','wheel'])document.addEventListener(ev,e=>{if(e.cancelable)e.preventDefault();},{passive:false});
const KG=['ArrowRight','KeyD','Space'],KB=['ArrowLeft','KeyA','ArrowDown','KeyS'],KU=['ArrowUp','KeyW','ShiftLeft','ShiftRight','KeyB'];
window.addEventListener('keydown',e=>{if(e.repeat){if(KG.includes(e.code)||KB.includes(e.code))e.preventDefault();return;}firstTap();
  if(KG.includes(e.code)){keys.go=1;e.preventDefault();}else if(KB.includes(e.code)){keys.brake=1;e.preventDefault();}else if(KU.includes(e.code)){doBoost();e.preventDefault();}
  else if(e.code==='Escape'||e.code==='KeyP'){if(scr==='race'&&R&&R.state==='run'){paused=!paused;if(M)M.hold(paused);}}
  else if(e.code==='Enter'){if(scr==='title')go('map');else if(scr==='results'&&R&&R.resT>1.4){if(reveal&&reveal.t>1)reveal=null;else if(!reveal){const nx=R.r+1<NR&&raceOpen(R.r+1);startRace(nx?R.r+1:R.r,prog.car);}}}});
window.addEventListener('keyup',e=>{if(KG.includes(e.code))keys.go=0;else if(KB.includes(e.code))keys.brake=0;});
window.addEventListener('blur',()=>{keys.go=0;keys.brake=0;ptr.clear();});
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(scr==='race'&&R&&R.state==='run'){paused=true;}if(AC)AC.suspend();}else if(AC)AC.resume();});
// ===== main loop =====
function drawRotate(){cx.setTransform(dpr,0,0,dpr,0,0);cx.fillStyle='#0a0d24';cx.fillRect(0,0,SW,SH);const s=Math.min(SW,SH)/400,t=performance.now()/1000;
  cx.save();cx.translate(SW/2,SH/2);cx.scale(s,s);const a=-Math.min(1,(t%2.4)/1.2)*PI/2;cx.rotate(a);rr(-60,-110,120,220,16);cx.fillStyle='#fff';cx.fill();rr(-50,-95,100,180,8);cx.fillStyle='#1e4fc2';cx.fill();
  cx.save();cx.rotate(-a);drawCar(CARS[prog.car].id,0,30,0,110,{noShadow:1});cx.restore();cx.restore();
  cx.save();cx.translate(SW/2+110*s,SH/2-130*s);cx.scale(s,s);cx.strokeStyle='#ffd23f';cx.lineWidth=8;cx.lineCap='round';cx.beginPath();cx.arc(0,0,40,-2.5,0);cx.stroke();cx.fillStyle='#ffd23f';cx.beginPath();cx.moveTo(52,-6);cx.lineTo(28,-6);cx.lineTo(40,14);cx.fill();cx.restore();}
let last=performance.now();
function frame(now){let dt=Math.min(.05,(now-last)/1000);last=now;dt*=TS;scrT+=dt;
  try{
    ptr.forEach((v,id)=>{if(v&&v.b&&v.b.hold&&!v.done&&performance.now()-v.t0>v.b.hold){v.done=true;v.b.cb();}});
    if(scr==='race'&&R)updateRace(dt);
    if(scr==='results'&&R){R.resT+=dt;stepFx(dt);if(reveal)reveal.t+=dt;}
    engineTick();
    cx.setTransform(dpr,0,0,dpr,0,0);cx.fillStyle='#05070f';cx.fillRect(0,0,SW,SH);
    if(portrait()){BTN=[];drawRotate();}
    else{cx.setTransform(dpr*sc,0,0,dpr*sc,dpr*ox,dpr*oy);cx.save();cx.beginPath();cx.rect(0,0,VW,VH);cx.clip();BTN=[];
      if(scr==='title')drawTitle();else if(scr==='map')drawMap();else if(scr==='garage')drawGarage();else if(scr==='race'&&R)drawRace();else if(scr==='results'&&R)drawResults();else go('map');
      cx.restore();}
  }catch(err){console.error(err);}
  requestAnimationFrame(frame);}
// test hooks for the headless bot (no effect on play)
window.__ttr={state:()=>({scr,paused,race:R?R.r:-1,st:R?R.state:'',t:R?+R.t.toFixed(2):0,s:P?Math.round(P.s):0,fin:T?Math.round(T.finS):0,v:P?Math.round(P.v):0,mode:P?P.mode:'',place:R?R.place:0,pplace:P?P.place:0,coins:R?R.coins:0,charge:R?R.charge:0,stars:prog.stars.slice(),car:prog.car,x:P?Math.round(P.x):0,y:P?Math.round(P.y):0,flips:R?R.flipCount||0:0,lp:P&&T?posAt(T,P.s).lp:0,gaps:R?cars.filter(c=>!c.isP).map(c=>Math.round(c.s-P.s)):[],said:vlog.slice(-6)}),
  start:(r,c)=>{initAudio();startRace(r,c==null?prog.car:c);},go:s=>go(s),prog:()=>prog,reset:()=>{prog={stars:new Array(NR).fill(0),car:0,coins:0,all:false,seen:{}};saveProg();},
  boost:()=>doBoost(),track:r=>{const t=buildTrack(r);let mn=1e9,mx=-1e9;for(let i=0;i<t.n;i++){mn=Math.min(mn,t.Y[i]);mx=Math.max(mx,t.Y[i]);}return{len:Math.round(t.finS),minY:Math.round(mn),maxY:Math.round(mx),jumps:t.jumps.map(j=>Math.round(j.minV)),loops:t.loops.length,coins:t.coins.length};},
  view:()=>({ox,oy,sc,VW,VH}),jumps:()=>T?T.jumps.map(j=>({s:Math.round(j.s),minV:Math.round(j.minV)})):[]};
loadProg();resize();requestAnimationFrame(frame);
