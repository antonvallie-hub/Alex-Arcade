function fx(o){if(R&&R.fx.length<500)R.fx.push(o);}
function sparks(x,y,n,a){for(let k=0;k<n;k++){const an=a+PI+rnd(-.9,.9)-.4,sp=rnd(250,700);fx({k:'spark',x,y,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp-200,l:rnd(.25,.5),m:.5});}}

function burstStars(x,y){for(let k=0;k<14;k++){const an=k/14*TAU;fx({k:'star',x,y,vx:Math.cos(an)*360,vy:Math.sin(an)*360-80,l:.8,m:.8,s:rnd(10,18)});}}
function confetti(x,y,n,spread){const C=['#ff3b3b','#ffd23f','#3fb6ff','#5cff6b','#ff6fd0','#ffffff','#ff9a2e'];for(let k=0;k<n;k++){const an=-PI/2+rnd(-spread,spread),sp=rnd(350,950);fx({k:'conf',x,y,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp,l:rnd(1.6,2.6),m:2.6,s:rnd(8,15),c:pick(C),rot:rnd(0,TAU),vr:rnd(-12,12)});}}
function coinPop(x,y){for(let k=0;k<6;k++){const an=rnd(0,TAU);fx({k:'glint',x,y,vx:Math.cos(an)*220,vy:Math.sin(an)*220,l:.35,m:.35,s:8});}fx({k:'ring',x,y,l:.3,m:.3,s:30});}
function stepFx(dt){for(let i=R.fx.length-1;i>=0;i--){const f=R.fx[i];f.l-=dt;if(f.l<=0){R.fx.splice(i,1);continue;}
  if(f.k==='conf'){f.vy+=900*dt;f.vx*=1-1.5*dt;f.vy*=1-1.2*dt;f.rot+=f.vr*dt;}else if(f.k==='spark'){f.vy+=1400*dt;}else if(f.k==='smoke'){f.vx*=1-1.5*dt;f.vy*=1-1.5*dt;f.s+=40*dt;}else if(f.k==='star'){f.vy+=700*dt;}else if(f.k==='flame'){f.vy-=200*dt;}else if(f.k==='debris'){f.vy+=1300*dt;f.rot+=f.vr*dt;}
  if(f.vx!==undefined){f.x+=f.vx*dt;f.y+=f.vy*dt;}}}
// ===== drawing helpers =====
function rr(x,y,w,h,r){cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath();}
function circ(x,y,r,c){cx.beginPath();cx.arc(x,y,r,0,TAU);cx.fillStyle=c;cx.fill();}
function shade(hex,f){let c=parseInt(hex.slice(1),16),r=c>>16,g=c>>8&255,b=c&255;const t=f<0?0:255,p=Math.abs(f);r=Math.round((t-r)*p+r);g=Math.round((t-g)*p+g);b=Math.round((t-b)*p+b);return'rgb('+r+','+g+','+b+')';}
// glossy chunky button: drop shadow, rim, gradient body, top highlight
function glossy(x,y,r,col,press){const pr=press?4:0;cx.save();
  circ(x,y+8,r,'rgba(0,0,0,.35)');circ(x,y+pr,r,shade(col,-.45));
  const g=cx.createRadialGradient(x-r*.3,y-r*.35+pr,r*.1,x,y+pr,r*.95);g.addColorStop(0,shade(col,.35));g.addColorStop(.55,col);g.addColorStop(1,shade(col,-.3));
  circ(x,y+pr-3,r*.9,g);
  cx.beginPath();cx.ellipse(x,y-r*.42+pr,r*.6,r*.3,0,0,TAU);cx.fillStyle='rgba(255,255,255,.35)';cx.fill();
  cx.lineWidth=Math.max(3,r*.07);cx.strokeStyle='rgba(255,255,255,.85)';cx.beginPath();cx.arc(x,y+pr-3,r*.9,0,TAU);cx.stroke();cx.restore();}
function txt(s,x,y,size,col,al,stroke){cx.font='900 '+size+'px "Arial Rounded MT Bold",system-ui,sans-serif';cx.textAlign=al||'center';cx.textBaseline='middle';
  if(stroke!==false){cx.lineJoin='round';cx.lineWidth=size*.2;cx.strokeStyle='rgba(20,10,40,.85)';cx.strokeText(s,x,y+size*.06);}cx.fillStyle=col||'#fff';cx.fillText(s,x,y);}
function btn(id,x,y,r,col,icon,cb,o){o=o||{};const pr=isPressed(id);BTN.push({id,x,y,r,cb,hold:o.hold||0});glossy(x,y,r,col,pr);if(icon)drawIcon(icon,x,y+(pr?4:0)-3,r/40,o.ic||'#fff');}
function isPressed(id){let p=false;ptr.forEach(v=>{if(v&&v.b&&v.b.id===id)p=true;});return p;}
function holdFrac(id){let f=0;ptr.forEach(v=>{if(v&&v.b&&v.b.id===id&&v.b.hold)f=clamp((performance.now()-v.t0)/v.b.hold,0,1);});return f;}
function drawIcon(k,x,y,s,col){cx.save();cx.translate(x,y);cx.scale(s,s);cx.fillStyle=col;cx.strokeStyle=col;cx.lineCap='round';cx.lineJoin='round';
  if(k==='play'){cx.beginPath();cx.moveTo(-12,-18);cx.lineTo(20,0);cx.lineTo(-12,18);cx.closePath();cx.fill();}
  else if(k==='pause'){rr(-14,-17,10,34,4);cx.fill();rr(4,-17,10,34,4);cx.fill();}
  else if(k==='back'){cx.lineWidth=8;cx.beginPath();cx.moveTo(8,-16);cx.lineTo(-10,0);cx.lineTo(8,16);cx.stroke();}
  else if(k==='next'){cx.lineWidth=8;cx.beginPath();cx.moveTo(-8,-16);cx.lineTo(10,0);cx.lineTo(-8,16);cx.stroke();cx.beginPath();cx.moveTo(-20,-16);cx.lineTo(-2,0);cx.lineTo(-20,16);cx.stroke();}
  else if(k==='retry'){cx.lineWidth=7;cx.beginPath();cx.arc(0,0,15,-.4,4.4);cx.stroke();cx.beginPath();cx.moveTo(16,-14);cx.lineTo(18,2);cx.lineTo(3,-3);cx.closePath();cx.fill();}
  else if(k==='home'){cx.beginPath();cx.moveTo(-20,0);cx.lineTo(0,-19);cx.lineTo(20,0);cx.lineTo(14,0);cx.lineTo(14,17);cx.lineTo(-14,17);cx.lineTo(-14,0);cx.closePath();cx.fill();}
  else if(k==='map'){for(let i=0;i<3;i++){circ(-16+i*16,6-(i%2)*10,6,col);}cx.lineWidth=4;cx.beginPath();cx.moveTo(-16,6);cx.lineTo(0,-4);cx.lineTo(16,6);cx.stroke();}
  else if(k==='lock'){cx.lineWidth=6;cx.beginPath();cx.arc(0,-6,10,PI,0);cx.stroke();rr(-15,-6,30,24,5);cx.fill();}
  else if(k==='car'){rr(-22,-6,44,14,6);cx.fill();rr(-12,-16,22,12,5);cx.fill();circ(-12,10,7,col);circ(12,10,7,col);}
  else if(k==='sound'){cx.beginPath();cx.moveTo(-18,-7);cx.lineTo(-8,-7);cx.lineTo(4,-17);cx.lineTo(4,17);cx.lineTo(-8,7);cx.lineTo(-18,7);cx.closePath();cx.fill();cx.lineWidth=4;cx.beginPath();cx.arc(4,0,10,-.8,.8);cx.stroke();cx.beginPath();cx.arc(4,0,17,-.8,.8);cx.stroke();}
  else if(k==='mute'){cx.beginPath();cx.moveTo(-18,-7);cx.lineTo(-8,-7);cx.lineTo(4,-17);cx.lineTo(4,17);cx.lineTo(-8,7);cx.lineTo(-18,7);cx.closePath();cx.fill();cx.lineWidth=4;cx.beginPath();cx.moveTo(9,-8);cx.lineTo(21,8);cx.moveTo(21,-8);cx.lineTo(9,8);cx.stroke();}
  else if(k==='bolt'){cx.beginPath();cx.moveTo(4,-26);cx.lineTo(-14,4);cx.lineTo(-1,4);cx.lineTo(-6,26);cx.lineTo(14,-6);cx.lineTo(1,-6);cx.closePath();cx.fill();}
  else if(k==='hand'){// stop hand: palm + four fingers + thumb
    rr(-15,-4,30,26,10);cx.fill();for(let i=0;i<4;i++){rr(-15+i*8,-26+(i===0||i===3?5:0),7,26,3.5);cx.fill();}cx.save();cx.translate(-15,8);cx.rotate(-.7);rr(-4,-16,8,20,4);cx.fill();cx.restore();}
  cx.restore();}
function star5(x,y,r,fill,stroke){cx.beginPath();for(let i=0;i<10;i++){const a=-PI/2+i*PI/5,rr2=i%2?r*.45:r;cx.lineTo(x+Math.cos(a)*rr2,y+Math.sin(a)*rr2);}cx.closePath();cx.fillStyle=fill;cx.fill();if(stroke){cx.lineWidth=3;cx.strokeStyle=stroke;cx.stroke();}}
function coinIcon(x,y,r){const g=cx.createRadialGradient(x-r*.3,y-r*.3,r*.1,x,y,r);g.addColorStop(0,'#fff6b0');g.addColorStop(.5,'#ffd23f');g.addColorStop(1,'#d48a00');circ(x,y,r,g);cx.lineWidth=r*.18;cx.strokeStyle='#fff3a0';cx.beginPath();cx.arc(x,y,r*.62,0,TAU);cx.stroke();star5(x,y,r*.45,'#fff3a0');}
function trophy(x,y,s,col){cx.save();cx.translate(x,y);cx.scale(s,s);const g=cx.createLinearGradient(-20,0,20,0);g.addColorStop(0,shade(col,-.2));g.addColorStop(.4,shade(col,.45));g.addColorStop(1,shade(col,-.25));cx.fillStyle=g;
  cx.beginPath();cx.moveTo(-20,-22);cx.lineTo(20,-22);cx.quadraticCurveTo(20,10,0,12);cx.quadraticCurveTo(-20,10,-20,-22);cx.fill();cx.lineWidth=5;cx.strokeStyle=shade(col,-.1);cx.beginPath();cx.arc(-20,-10,9,PI*.5,PI*1.5);cx.stroke();cx.beginPath();cx.arc(20,-10,9,-PI*.5,PI*.5);cx.stroke();
  cx.fillRect(-4,10,8,10);rr(-14,18,28,8,3);cx.fill();cx.fillStyle='rgba(255,255,255,.55)';cx.fillRect(-12,-18,5,18);cx.restore();}
function carImg(id){return IMG['car_'+id];}
// car sprite drawn with its wheel contact point at (0,0): suspension bob, shadow, boost tint
function drawCar(id,x,y,ang,w,o){o=o||{};const im=carImg(id);cx.save();cx.translate(x,y);cx.rotate(ang);if(o.flip)cx.rotate(o.flip);
  const h=okI(im)?w*im.naturalHeight/im.naturalWidth:w*.6;const bob=o.bob||0;
  if(!o.noShadow&&!o.flip){cx.fillStyle='rgba(0,0,0,.28)';cx.beginPath();cx.ellipse(0,2,Math.abs(w*.46)+.1,7,0,0,TAU);cx.fill();}
  if(o.squash){cx.scale(1+o.squash*.12,1-o.squash*.15);}
  if(okI(im))cx.drawImage(im,-w/2,-h+bob+2,w,h);else{rr(-w/2,-h*.8,w,h*.6,12);cx.fillStyle='#e33';cx.fill();}
  cx.restore();}
function carFace(id,x,y,r,ring){cx.save();circ(x,y,r+4,ring||'#fff');circ(x,y,r,'#1c2a5a');cx.beginPath();cx.arc(x,y,r,0,TAU);cx.clip();const im=carImg(id);
  if(okI(im)){const sw=im.naturalWidth*.6,sx=im.naturalWidth-sw,sh=im.naturalHeight,s=(r*2.3)/Math.max(sw,sh);cx.drawImage(im,sx,0,sw,sh,x-sw*s*.55,y-sh*s*.52,sw*s,sh*s);}cx.restore();}
function drawBG(w,camX,camY,z){const im=IMG[w.bg];const g=cx.createLinearGradient(0,0,0,VH);g.addColorStop(0,w.sky[0]);g.addColorStop(1,w.sky[1]);cx.fillStyle=g;cx.fillRect(0,0,VW,VH);
  if(okI(im)){const H=VH*1.18,W=H*im.naturalWidth/im.naturalHeight;let x0=-((camX*.08)%(W*2));if(x0>0)x0-=W*2;const y0=clamp(-(camY-300)*.06,-VH*.18,0)-VH*.05;
    for(let x=x0,k=0;x<VW;x+=W,k++){const mir=(Math.round((x-x0)/W))%2===1;cx.save();if(mir){cx.translate(x+W,y0);cx.scale(-1,1);cx.drawImage(im,0,0,W,H);}else cx.drawImage(im,x,y0,W,H);cx.restore();}}}
function drawFx(f){const a=clamp(f.l/f.m,0,1);
  if(f.k==='spark'){cx.strokeStyle='rgba(255,'+(200+Math.random()*55|0)+',80,'+a+')';cx.lineWidth=3;cx.beginPath();cx.moveTo(f.x,f.y);cx.lineTo(f.x-f.vx*.03,f.y-f.vy*.03);cx.stroke();}
  else if(f.k==='smoke'){cx.fillStyle=f.c+(a*.55)+')';cx.beginPath();cx.arc(f.x,f.y,f.s,0,TAU);cx.fill();}
  else if(f.k==='flame'){const g=cx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.s);g.addColorStop(0,'rgba(255,255,200,'+a+')');g.addColorStop(.5,'rgba(255,150,30,'+a*.8+')');g.addColorStop(1,'rgba(255,50,0,0)');cx.fillStyle=g;cx.beginPath();cx.arc(f.x,f.y,f.s,0,TAU);cx.fill();}
  else if(f.k==='star'){cx.globalAlpha=a;star5(f.x,f.y,f.s,'#ffd23f','#fff');cx.globalAlpha=1;}
  else if(f.k==='glint'){cx.globalAlpha=a;star5(f.x,f.y,f.s*(.5+a),'#fff8c0');cx.globalAlpha=1;}
  else if(f.k==='ring'){cx.strokeStyle='rgba(255,240,150,'+a+')';cx.lineWidth=4;cx.beginPath();cx.arc(f.x,f.y,f.s*(1.6-a),0,TAU);cx.stroke();}
  else if(f.k==='conf'){cx.save();cx.translate(f.x,f.y);cx.rotate(f.rot);cx.globalAlpha=Math.min(1,a*2);cx.fillStyle=f.c;cx.fillRect(-f.s/2,-f.s/4,f.s,f.s/2);cx.restore();}
  else if(f.k==='debris'){cx.save();cx.translate(f.x,f.y);cx.rotate(f.rot);cx.globalAlpha=Math.min(1,a*2);cx.fillStyle=f.c;cx.fillRect(-f.s,-f.s/3,f.s*2,f.s*.66);cx.restore();}}

const VMAX=27,ACC=13,VB=40,BACC=34,BRK=28,COAST=3.5,LATV=9,GRAV=24;
let T=null,R=null,P=null,cars=[];
const ITEMS=['rocket','shield','giant','goo','honk'];
const ITEM_SAY={rocket:'Rocket boost!',shield:'Bubble shield!',giant:'Giant car!',goo:'Goo drop!',honk:'Honk honk!'};
function mkCar(id,isP,k,lane){return{id,isP,k,lane,s:0,d:0,v:0,air:0,cy:0,vy:0,airT:0,spinT:0,spinA:0,spinDir:1,boostT:0,shieldT:0,giantT:0,gs:id==='boss'?1.9:1,item:null,roll:0,coins:0,sc:null,fin:0,place:0,lat:0,yaw:0,wr:0,gas:0,brake:0,steerIn:0,stall:0,hitCD:0,aiRocket:rnd(4,9),model:null,blob:null,wx:0,wy:0,wz:0,F:V3(),U:V3(),Lv:V3()};}
function initScene(){if(scene)return;scene=new THREE.Scene();
  const hemi=new THREE.HemisphereLight(0xffffff,0x9a7a5a,1.5);scene.add(hemi);const sun=new THREE.DirectionalLight(0xffffff,2.1);sun.position.set(.45,1,.3);scene.add(sun);
  initParticles();scene.add(PS);

  CK=new THREE.Scene();CK.add(new THREE.HemisphereLight(0xffffff,0x665544,1.6));const s2=new THREE.DirectionalLight(0xffffff,1.6);s2.position.set(.3,1,.6);CK.add(s2);ckG=new THREE.Group();CK.add(ckG);}
// item boxes / coins / obstacle meshes for one race
function buildPickups(){const nC=T.coins.filter(c=>!c.star).length,nS=T.coins.length-nC;
  R.coinIM=new THREE.InstancedMesh(GEO.coin,new THREE.MeshLambertMaterial({color:0xffc81e,emissive:0x5a3c00}),Math.max(1,nC));R.starIM=new THREE.InstancedMesh(GEO.star,new THREE.MeshLambertMaterial({color:0xffe94d,emissive:0x6a5000}),Math.max(1,nS));
  R.coinIM.material.__own=1;R.starIM.material.__own=1;let a=0,b=0;
  for(const c of T.coins){const fr=frameAt(T,c.s,c.d,_f);c.p=[fr.x+fr.ux*1.25,fr.y+fr.uy*1.25,fr.z+fr.uz*1.25];c.ang=Math.atan2(fr.fz,fr.fx);c.got=0;c.idx=c.star?b++:a++;}
  R.boxIM=new THREE.InstancedMesh(new THREE.BoxGeometry(1.7,1.7,1.7),new THREE.MeshLambertMaterial({map:texBox(),emissive:0x333333}),Math.max(1,T.boxes.length));R.boxIM.material.__own=1;
  for(const bx of T.boxes){const fr=frameAt(T,bx.s,bx.d,_f);bx.p=[fr.x+fr.ux*1.5,fr.y+fr.uy*1.5,fr.z+fr.uz*1.5];bx.hide=0;}
  WG.add(R.coinIM,R.starIM,R.boxIM);
  R.obs=T.obs.map((o,i)=>{let m;const g=new THREE.Group();
    if(o.k==='cone'){g.add(MS(GEO.cone,mat(0xff7a1a),.75,1.9,.75,0,.95,0));g.add(MS(GEO.cyl,mat(0xffffff),.5,.3,.5,0,1.05,0));g.add(MS(GEO.box,mat(0xff7a1a),1.6,.15,1.6,0,.08,0));}
    else if(o.k==='ball'){m=MS(GEO.sph,new THREE.MeshLambertMaterial({map:texBall()}),1.25,1.25,1.25,0,1.25,0);g.add(m);g.userData.ball=m;}
    else if(o.k==='block'){const cc=[0xff5a5a,0x3fa9ff,0xffd23f,0x5cd65c][i%4];g.add(MS(GEO.box,mat(cc),2,2,2,0,1,0));g.add(MS(GEO.cyl,mat(cc),.35,.3,.35,.5,2.1,.5));g.add(MS(GEO.cyl,mat(cc),.35,.3,.35,-.5,2.1,-.5));g.add(MS(GEO.cyl,mat(cc),.35,.3,.35,.5,2.1,-.5));g.add(MS(GEO.cyl,mat(cc),.35,.3,.35,-.5,2.1,.5));}
    else{const pm=new THREE.MeshPhongMaterial({color:T.w.id==='desert'?0x8a5a2f:0x3fa0ff,transparent:true,opacity:.85,shininess:100,specular:0xffffff});pm.__own=1;g.add(MS(GEO.circle,pm,2.3,1,1.6,0,.07,0));}
    WG.add(g);return{...o,g,hitT:0,gone:0,id:i};});
  R.goo=[];}
function startRace(r,carK,cam){initScene();if(WG){scene.remove(WG);disposeGroup(WG);WG=null;}
  T=buildTrack(r);T.w=WORLDS[worldOf(r)];const boss=isBoss(r);prog.car=carK;saveProg();
  buildWorld(T,worldOf(r));
  P=mkCar(CARS[carK].id,true,1,0);
  let pool=CARS.map((c,i)=>i).filter(i=>i!==carK);pool.sort(()=>Math.random()-.5);
  cars=boss?[mkCar('boss',false,1.03,1)]:pool.slice(0,3).map((k,i)=>mkCar(CARS[k].id,false,[1.0,.97,.94][i],i+1));
  // starting grid behind the line: rivals ahead of Alex in a staggered 2-wide grid
  const G=[[-6,3],[-12,-3],[-18,3]];cars.forEach((c,i)=>{c.s=G[i][0]+(boss?-2:0);c.d=boss?3:G[i][1];c.laneD=[-3.5,3.5,0][i%3];});P.s=-18-(boss?6:0)+ (boss?12:0);P.d=boss?-3:-3;if(!boss){P.s=-24;P.d=-3;}cars.push(P);
  for(const c of cars){c.model=buildCar(c.id);c.model.matrixAutoUpdate=false;WG.add(c.model);const bl=new THREE.Mesh(GEO.plane,new THREE.MeshBasicMaterial({map:texShadow(),transparent:true,depthWrite:false}));bl.material.__own=1;bl.scale.set(5.2*c.gs,1,3*c.gs);bl.matrixAutoUpdate=false;WG.add(bl);c.blob=bl;}
  buildCockpit(P.id);
  R={r,t:0,state:'pick',stT:0,cd:3,coins:0,finCount:0,place:0,shake:0,flash:0,slow:0,said:{},idle:0,hintT:0,finalSaid:false,lastPass:0,boss,fx:[],resT:0,cam:cam||prog.cam||'chase',lap:0,wheelA:0,fov:66,ce:null,cu:V3().set(0,1,0),camK:0,scSaid:0,ckHide:0,rollIcon:0};
  buildPickups();

function drawGarage(){menuBG('#5a1a8a','#160a3a');txt('PICK YOUR CAR!',VW/2,46,42,'#ffd23f');

function drawResults(){const w=T.w;drawBG(w,0,300,1);cx.fillStyle='rgba(10,10,40,.45)';cx.fillRect(0,0,VW,VH);const t=R.resT;
  cx.save();cx.translate(VW/2,VH*.5);cx.rotate(t*.4);for(let k=0;k<14;k++){cx.rotate(TAU/14);cx.fillStyle=k%2?'rgba(255,210,63,.16)':'rgba(255,255,255,.07)';cx.beginPath();cx.moveTo(0,0);cx.lineTo(900,-120);cx.lineTo(900,120);cx.fill();}cx.restore();

  if(Math.random()<.12)confetti(rnd(0,VW),-20,3,.4);
  for(const f of R.fx)if(f.k==='conf')drawFx(f);
  if(R.newCars&&R.newCars.length&&t>2.6){if(!reveal){reveal={k:R.newCars.shift(),t:0};sfx('unlock');say(['New car!',CARS[reveal.k].name+'!'],true);}}
  if(reveal)drawReveal();}
function drawReveal(){const r=reveal,t=r.t;cx.fillStyle='rgba(10,5,40,.85)';cx.fillRect(0,0,VW,VH);cx.save();cx.translate(VW/2,VH/2);cx.rotate(t*.6);for(let k=0;k<12;k++){cx.rotate(TAU/12);cx.fillStyle=k%2?'rgba(255,210,63,.25)':'rgba(255,255,255,.08)';cx.beginPath();cx.moveTo(0,0);cx.lineTo(800,-110);cx.lineTo(800,110);cx.fill();}cx.restore();
  txt('NEW CAR!',VW/2,70,64,'#ffd23f');const s=easeBack(clamp(t*1.5,0,1));drawCar(CARS[r.k].id,VW/2,VH*.72,0,380*s,{});txt(CARS[r.k].name,VW/2,VH-50,40,'#fff');
  for(let k=0;k<8;k++){const a=t*2+k*.785;star5(VW/2+Math.cos(a)*260,VH*.55+Math.sin(a)*120,10+Math.sin(t*8+k)*4,'#ffd23f');}
  BTN=[{id:'rev',x:VW/2,y:VH/2,r:2000,cb:()=>{if(r.t>1){reveal=null;}}}];}
function drawRotate(){cx.setTransform(dpr,0,0,dpr,0,0);cx.fillStyle='#0a0d24';cx.fillRect(0,0,SW,SH);const s=Math.min(SW,SH)/400,t=performance.now()/1000;
  cx.save();cx.translate(SW/2,SH/2);cx.scale(s,s);const a=-Math.min(1,(t%2.4)/1.2)*PI/2;cx.rotate(a);rr(-60,-110,120,220,16);cx.fillStyle='#fff';cx.fill();rr(-50,-95,100,180,8);cx.fillStyle='#1e4fc2';cx.fill();
  cx.save();cx.rotate(-a);drawCar(CARS[prog.car].id,0,30,0,110,{noShadow:1});cx.restore();cx.restore();
  cx.save();cx.translate(SW/2+110*s,SH/2-130*s);cx.scale(s,s);cx.strokeStyle='#ffd23f';cx.lineWidth=8;cx.lineCap='round';cx.beginPath();cx.arc(0,0,40,-2.5,0);cx.stroke();cx.fillStyle='#ffd23f';cx.beginPath();cx.moveTo(52,-6);cx.lineTo(28,-6);cx.lineTo(40,14);cx.fill();cx.restore();}
// ===== input =====
let firstDone=false,rotDismissed=false;
function vpt(e){return{x:(e.clientX-ox)/sc,y:(e.clientY-oy)/sc};}
function firstTap(){initAudio();voicePreload();if(firstDone)return;firstDone=true;if(scr==='title')setTimeout(()=>say(['Turbo Toy Racers!'],true),200);
  try{const de=document.documentElement,rq=de.requestFullscreen||de.webkitRequestFullscreen;if(rq&&document.fullscreenEnabled!==false&&!document.fullscreenElement){const p=rq.call(de,{navigationUI:'hide'});
    const lk=()=>{try{const q=screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape');if(q&&q.catch)q.catch(()=>{});}catch(e){}};
    if(p&&p.then)p.then(lk).catch(()=>{});else lk();}}catch(e){}}
const portrait=()=>SH>SW*1.05&&!rotDismissed;
// big forgiving zones: wheel (and anything right of the item button) = GO, pedal corner = BRAKE
function raceControl(p){hudLayout();const h=HUDC;if(hyp(p.x-h.pause.x,p.y-h.pause.y)<h.pause.r+14)return'pause';if(hyp(p.x-h.cam.x,p.y-h.cam.y)<h.cam.r+14)return'cam';
  if(hyp(p.x-h.item.x,p.y-h.item.y)<h.item.r+30)return'item';if(hyp(p.x-h.brake.x,p.y-h.brake.y)<h.brake.r+50||(p.x<VW*.3&&p.y>VH*.45))return'brake';return'go';}
cv.addEventListener('pointerdown',e=>{e.preventDefault();firstTap();try{cv.setPointerCapture(e.pointerId);}catch(_){}const p=vpt(e);
  if(portrait()){rotDismissed=true;return;}
  if(scr==='race'&&R&&!paused&&(R.state==='run'||R.state==='count'||R.state==='intro')){const role=raceControl(p);
    if(role==='pause'){paused=true;if(M)M.hold(true);sfx('click');return;}if(role==='cam'){switchCam();return;}if(role==='item'){useItem();return;}
    ptr.set(e.pointerId,{r:role,x0:p.x,x:p.x});return;}
  for(let k=BTN.length-1;k>=0;k--){const b=BTN[k];if(hyp(p.x-b.x,p.y-b.y)<b.r+10){ptr.set(e.pointerId,{b,t0:performance.now(),done:false});return;}}
  if(scr==='title'){sfx('click');go('map');}});
cv.addEventListener('pointermove',e=>{const v=ptr.get(e.pointerId);if(v&&v.r){const p=vpt(e);v.x=p.x;}});
function pup(e){const v=ptr.get(e.pointerId);ptr.delete(e.pointerId);if(!v||v.r)return;const p=vpt(e);if(!v.b.hold&&hyp(p.x-v.b.x,p.y-v.b.y)<v.b.r+24)v.b.cb();}
cv.addEventListener('pointerup',pup);cv.addEventListener('pointercancel',e=>ptr.delete(e.pointerId));
for(const ev of['touchstart','touchmove','touchend','gesturestart','gesturechange','dblclick','contextmenu','wheel'])document.addEventListener(ev,e=>{if(e.cancelable)e.preventDefault();},{passive:false});
const KG=['ArrowUp','KeyW','Space'],KB=['ArrowDown','KeyS'],KL=['ArrowLeft','KeyA'],KR=['ArrowRight','KeyD'],KU=['ShiftLeft','ShiftRight','KeyB','KeyE'];
window.addEventListener('keydown',e=>{if(e.repeat){if([...KG,...KB,...KL,...KR].includes(e.code))e.preventDefault();return;}firstTap();
  if(KG.includes(e.code)){keys.go=1;e.preventDefault();}else if(KB.includes(e.code)){keys.brake=1;e.preventDefault();}else if(KL.includes(e.code)){keys.l=1;e.preventDefault();}else if(KR.includes(e.code)){keys.r=1;e.preventDefault();}
  else if(KU.includes(e.code)){useItem();e.preventDefault();}else if(e.code==='KeyC'){if(scr==='race')switchCam();}
  else if(e.code==='Escape'||e.code==='KeyP'){if(scr==='race'&&R&&R.state==='run'){paused=!paused;if(M)M.hold(paused);}}
  else if(e.code==='Enter'){if(scr==='title')go('map');else if(scr==='cam')beginRace(prog.cam||'chase');else if(scr==='results'&&R&&R.resT>1.4){if(reveal&&reveal.t>1)reveal=null;else if(!reveal){const nx=R.r+1<NR&&raceOpen(R.r+1);openCam(nx?R.r+1:R.r,prog.car);}}}});
window.addEventListener('keyup',e=>{if(KG.includes(e.code))keys.go=0;else if(KB.includes(e.code))keys.brake=0;else if(KL.includes(e.code))keys.l=0;else if(KR.includes(e.code))keys.r=0;});
window.addEventListener('blur',()=>{keys.go=0;keys.brake=0;keys.l=0;keys.r=0;ptr.clear();});
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(scr==='race'&&R&&R.state==='run'){paused=true;}if(AC)AC.suspend();}else if(AC)AC.resume();});
// ===== main loop =====
let last=performance.now();
function frame(now){const raw=Math.min(.1,(now-last)/1000);let dt=Math.min(.05,raw);last=now;dt*=TS;scrT+=dt;const t0=performance.now();
  try{
    ptr.forEach((v,id)=>{if(v&&v.b&&v.b.hold&&!v.done&&performance.now()-v.t0>v.b.hold){v.done=true;v.b.cb();}});
    if(scr==='race'&&R){updateRace(dt,raw);if(!paused)stepWorld(dt);render3D();perfTick(raw);}
    if(scr==='results'&&R){R.resT+=dt;stepFx(dt);if(reveal)reveal.t+=dt;}
    engineTick();
    cx.setTransform(dpr,0,0,dpr,0,0);if(scr==='race'&&!portrait())cx.clearRect(0,0,SW,SH);else{cx.fillStyle='#05070f';cx.fillRect(0,0,SW,SH);}
    if(portrait()){BTN=[];drawRotate();}
    else{cx.setTransform(dpr*sc,0,0,dpr*sc,dpr*ox,dpr*oy);cx.save();cx.beginPath();cx.rect(0,0,VW,VH);cx.clip();BTN=[];
      if(scr==='title')drawTitle();else if(scr==='map')drawMap();else if(scr==='garage')drawGarage();else if(scr==='cam'&&R)drawCamPick();else if(scr==='race'&&R)drawRace();else if(scr==='results'&&R)drawResults();else go('map');
      cx.restore();}
  }catch(err){console.error(err);}
  perf.ms=perf.ms*.95+(performance.now()-t0)*.05;perf.frames++;
  requestAnimationFrame(frame);}
// test hooks for the headless bot (no effect on play)
window.__ttr={state:()=>({scr,paused,race:R?R.r:-1,st:R?R.state:'',t:R?+R.t.toFixed(2):0,s:P?Math.round(P.s):0,fin:T?Math.round(T.len*T.laps):0,len:T?Math.round(T.len):0,v:P?+P.v.toFixed(1):0,d:P?+P.d.toFixed(2):0,air:P?P.air:0,sc:P&&P.sc?1:0,lap:R?R.lap:0,place:R?R.place:0,pplace:P?P.place:0,coins:R?R.coins:0,item:P?P.item:null,roll:P?+P.roll.toFixed(2):0,
    spin:P?+P.spinT.toFixed(2):0,giant:P?+P.giantT.toFixed(1):0,shield:P?+P.shieldT.toFixed(1):0,boost:P?+P.boostT.toFixed(2):0,wheel:R?+R.wheelA.toFixed(2):0,cam:R?R.cam:'',stars:prog.stars.slice(),car:prog.car,gaps:R&&P?cars.filter(c=>!c.isP).map(c=>Math.round(c.s-P.s)):[],said:vlog.slice(-6)}),
  start:(r,c,cam)=>{initAudio();startRace(r,c==null?prog.car:c,cam||prog.cam);beginRace(cam||prog.cam||'chase');},openCam:(r,c)=>{initAudio();openCam(r,c==null?prog.car:c);},pickCam:m=>beginRace(m),setCam:m=>{if(R&&R.cam!==m)switchCam();},
  go:s=>go(s),prog:()=>prog,reset:()=>{prog={stars:new Array(NR).fill(0),car:0,coins:0,all:false,seen:{},cam:'chase'};saveProg();},
  item:()=>useItem(),give:k=>{if(P){P.item=k;P.roll=0;}},warp:s=>{if(P){const d=s-P.s;for(const c of cars)c.s+=d;R.ce=null;}},
  perf:()=>Object.assign({},perf,{q:qi,pr:perf.pr,hist:perf.hist.slice(-30)}),setQ:i=>{qi=i;setPR();},
  track:r=>{const t=buildTrack(r);return{len:Math.round(t.len),laps:t.laps,jumps:t.jumps.length,loops:t.loops.length,sc:t.sc.length,pads:t.pads.length,coins:t.coins.length,boxes:t.boxes.length,obs:t.obs.length};},
  view:()=>({ox,oy,sc,VW,VH}),feat:()=>T?{len:T.len,laps:T.laps,jumps:T.jumps.map(j=>j.sLip),loops:T.loops.map(l=>l.s0),sc:T.sc.map(q=>q.sa),pads:T.pads}:null,hud:()=>{hudLayout();return JSON.parse(JSON.stringify(HUDC));},gl:()=>glOK,ck:()=>{const v=new THREE.Vector3();ckG.updateMatrixWorld(true);CKW.getWorldPosition(v);const w=v.clone().project(CKC);return{wa:R&&R.wheelA,camp:CAM.position.toArray(),fov:CAM.fov,nd:CKN.parent.rotation.z,spin:CKW.userData.spin.rotation.z,p:[v.x,v.y,v.z],ndc:[w.x,w.y,w.z],n:ckG.children.length,fov:CKC.fov,asp:CKC.aspect,cam:R&&R.cam};}};
loadProg();if(!prog.cam)prog.cam='chase';resize();setPR();requestAnimationFrame(frame);
